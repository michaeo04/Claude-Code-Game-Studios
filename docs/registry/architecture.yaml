# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-10-02"  # ADR-0002, ADR-0003, ADR-0005, ADR-0006 and ADR-0007 stances added

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: frame_tick_order
    status: active
    owner_system: game-root
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    interface: "GameRoot._tick(real_dt, world_dt): the only place the per-frame call order is written"
    write_access: game-root-only
    referenced_by:
      - docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02
    revised: ""

  - state: subscriber_order
    status: active
    owner_system: game-root
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    interface: "GameRoot._wire() rows [Signal, Callable, rank:int]; ranks are owned by Run State (run_reset, run_ended, run_abandoned)"
    write_access: game-root-only
    referenced_by:
      - docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02
    revised: ""

  - state: clock_us
    status: active
    owner_system: game-root
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    interface: "Callable -> int (microseconds), wraps Time.get_ticks_usec(); injected into every system that needs time"
    write_access: game-root-only
    referenced_by:
      - docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02
    revised: ""


  - state: renderer_backend
    status: active
    owner_system: game-root
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    interface: "ProjectSettings rendering_method and rendering_method.mobile = mobile (rollback: rendering_method.mobile = forward_plus); GameRoot checks RenderingServer.get_current_rendering_method() at boot and blocks a non-mobile device"
    write_access: game-root-only
    referenced_by:
      - docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02
    revised: ""

  - state: tube_mesh_material
    status: active
    owner_system: tube-track
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    interface: "one ArrayMesh and one ShaderMaterial shared by all N slots, created once at load_map; the only dynamic shared parameter is seam_contrast_scale (set on change)"
    write_access: tube-track-only
    referenced_by:
      - docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02
    revised: ""


  - state: sensor_samples
    status: active
    owner_system: tilt-input
    adr: docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    interface: "TiltInput.poll() reads Input.get_gravity() once per rendered frame; steer, valid, input_source are read-only getters; no other file reads motion sensors"
    write_access: tilt-input-only
    referenced_by:
      - docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    added: 2026-10-02
    revised: ""

  - state: required_input_settings
    status: active
    owner_system: platform-services
    adr: docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    interface: "manifest: input_devices/sensors/enable_gravity=true (other sensor flags false), display/window/handheld/orientation=1, emulate_mouse_from_touch=true, emulate_touch_from_mouse=true; checked at boot and in CI"
    write_access: platform-services-only
    referenced_by:
      - docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    added: 2026-10-02
    revised: ""

  - state: press_us
    status: active
    owner_system: hud-and-menus-views
    adr: docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    interface: "one stamp per tap from the injected clock_us: the Hit tap catcher in _gui_input (ScreenTouch pressed, any index) or a stock Button in button_down; forwarded to Run State"
    write_access: input-handlers-only
    referenced_by:
      - docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    added: 2026-10-02
    revised: ""


  - state: lifecycle_state
