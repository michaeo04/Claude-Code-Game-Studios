# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: autoload_singletons
    status: active
    description: "No autoload entries for game systems; GameRoot constructs and owns every system."
    why: "Hidden coupling, no explicit construction order, hard to inject test doubles."
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02

  - pattern: view_node_own_process
    status: active
    description: "View and driver Nodes do not run their own _process or _physics_process; GameRoot calls them."
    why: "The per-frame order is a correctness requirement and must be written in one place."
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02

  - pattern: connect_deferred_control_signals
    status: active
    description: "Control signals (run_*, hit_reported, window_*) are never connected with CONNECT_DEFERRED."
    why: "Deferred handlers run after emit() returns and escape the re-entrancy guards and the pinned order."
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02

  - pattern: engine_time_scale_writes
    status: active
    description: "No code writes Engine.time_scale."
    why: "Run State derives time from the real clock; hit-stop is a real-time hold of effects, not a time scale."
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02

  - pattern: scene_tree_paused_for_pause
    status: active
    description: "Pause, Hit and Resuming freeze the world through dt_eff = 0, never through SceneTree.paused."
    why: "The tick must keep running for Tilt polling, the restart lock and the HUD."
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02

  - pattern: physics_process_game_logic
    status: active
    description: "No game-logic code runs in _physics_process."
    why: "Engine may run several physics steps per frame; polling and collision must follow the rendered frame."
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02


  - pattern: engine_glow_for_gameplay_effects
    status: active
    description: "WorldEnvironment glow is off in the MVP; the PB bloom and near-miss ring are shader terms or overlay opacity."
    why: "Glow ordering changed in 4.6 and its Mobile cost is unmeasured; effects must not change the fog and contrast numbers."
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02

  - pattern: realtime_shadows
    status: active
    description: "No light casts shadows; tube cast_shadow is off."
    why: "Draw-call and GPU budget; the flat-shaded look comes from the material."
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02

  - pattern: compositor_effects_mvp
    status: active
    description: "No Compositor / CompositorEffect post-processing in the MVP."
    why: "Extra full-screen passes on Mobile are unmeasured and would alter measured contrast."
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02

  - pattern: unique_mesh_or_material_per_tube_slot
    status: active
    description: "Every tube slot references the same Mesh and the same Material resource."
    why: "Keeps the draw-call count predictable and the seam uniform shared."
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02

  - pattern: opengl_renderer_fallback
    status: active
    description: "The OpenGL (Compatibility) fallback is disabled; a device that is not running the mobile renderer is blocked at boot."
    why: "Fog and glow differ under Compatibility and invalidate Environment F1."
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02

