    owner_system: platform-services
    adr: docs/architecture/adr-0006-android-platform-integration.md
    interface: "focused, paused, attentive, suspended flags; attentive and suspended are read-only getters; consumers read them on connect because signals are not replayed"
    write_access: platform-services-only
