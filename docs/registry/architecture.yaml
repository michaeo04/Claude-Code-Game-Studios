    write_access: platform-services-manifest-only
    referenced_by:
      - docs/architecture/adr-0006-android-platform-integration.md
    added: 2026-10-02
    revised: ""


  - state: save_profile
    status: active
    owner_system: save-persistence
    adr: docs/architecture/adr-0007-persistence-implementation.md
    interface: "user://save.cfg (ConfigFile: [scoring], [settings], [cosmetics], [_meta]); written only through SaveCore.set_value, one complete-map temp-then-rename write; read once by SaveCore.boot_load before dependents exist"
    write_access: save-core-only
    referenced_by:
      - docs/architecture/adr-0007-persistence-implementation.md
    added: 2026-10-02
    revised: ""

