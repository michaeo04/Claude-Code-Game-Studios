# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: run_lifecycle_events
    status: active
    pattern: signal
    producer: run-state
    consumers:
      - pattern-difficulty
      - tube-track-adapter
      - obstacle-system
      - ball-movement
      - camera
      - juice-feedback
      - scoring-personal-best
      - hud
      - near-miss-detection
      - tilt-input
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    signal_signature: "run_reset(run_id: int), run_ended(run_id: int, hazard_id: int, run_time_ms: int), run_abandoned(run_id: int, run_time_ms: int)"
    notes: "Immediate connections only, typed handlers, no CONNECT_DEFERRED, no request from inside a handler; order pinned by GameRoot._wire() rows."
    referenced_by:
      - docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02
    revised: ""


  - contract: tube_slot_binding
    status: active
    pattern: direct_call
    producer: tube-track
    consumers:
      - tube-view
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    signal_signature: "TubeView.bind_slot(slot_index: int, segment_index: int) -> void  (sets the slot transform and calls reset_physics_interpolation(); allocates nothing)"
    referenced_by:
      - docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02
    revised: ""


  - contract: tilt_pull
    status: active
    pattern: direct_call
    producer: tilt-input
    consumers:
      - ball-movement
      - menus-screen-flow
      - hud
    adr: docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    signal_signature: "TiltInput.steer: float [-1,1], valid: bool, input_source: int (SENSOR, FALLBACK); read after poll() in the same tick"
    referenced_by:
      - docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    added: 2026-10-02
    revised: ""

  - contract: tap_stamp
    status: active
    pattern: direct_call
    producer: hud-and-menus-views
    consumers:
      - run-state
    adr: docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    signal_signature: "restart_requested(press_us: int), menu_requested(press_us: int); press_us read from clock_us on the first line of the catcher _gui_input or of the Button button_down handler"
    referenced_by:
      - docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    added: 2026-10-02
    revised: ""


  - contract: lifecycle_signals
    status: active
    pattern: signal
    producer: platform-services
    consumers:
      - run-state-adapter
      - save-persistence
      - tilt-input
      - menus-screen-flow
    adr: docs/architecture/adr-0006-android-platform-integration.md
    signal_signature: "app_interrupted(), app_backgrounded(), app_foregrounded(), app_returned(), back_pressed(); no payloads, emitted on edges only, synchronously on the main thread"
    referenced_by:
      - docs/architecture/adr-0006-android-platform-integration.md
    added: 2026-10-02
    revised: ""


  - contract: save_value_api
    status: active
    pattern: direct_call
    producer: save-persistence
    consumers:
      - scoring-personal-best
      - settings-accessibility
    adr: docs/architecture/adr-0007-persistence-implementation.md
    signal_signature: "get_value(section: String, key: String, default: Variant) -> Variant; set_value(section: String, key: String, value: Variant) -> bool (synchronous write, false on failure, memory still updated); flush() -> void (no-op today); no signals"
    referenced_by:
      - docs/architecture/adr-0007-persistence-implementation.md
    added: 2026-10-02
    revised: ""

  - contract: save_fs_facade
    status: active
    pattern: injected_object
    producer: save-persistence
    consumers:
      - save-core
    adr: docs/architecture/adr-0007-persistence-implementation.md
    signal_signature: "SaveFs: read_config(path) -> Dictionary, write_config(path, sections) -> bool, exists(path) -> bool, size(path) -> int, rename(from, to) -> bool, delete(path) -> bool, list_backups(dir, prefix) -> PackedStringArray; real implementation is an inner class of SaveService, tests extend SaveFs"
    referenced_by:
      - docs/architecture/adr-0007-persistence-implementation.md
    added: 2026-10-02
    revised: ""

