# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: frame_clock
    status: active
    api: "Time.get_ticks_usec() through the injected clock_us Callable"
    not: "the _process engine delta (scaled by time_scale, capped near 0.133 s)"
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    reason: "Run State's stall guard needs the raw real-time interval; cores must not call Time."
    referenced_by:
      - docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02
    revised: ""

  - purpose: game_tick
    status: active
    api: "GameRoot._process (PROCESS_MODE_ALWAYS)"
    not: "_physics_process, per-node _process with process_priority"
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    reason: "One owner and one fixed order; analytic collision needs no physics step; sensor polling must follow rendered frames."
    referenced_by:
      - docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02
    revised: ""


  - purpose: renderer
    status: active
    api: "Mobile renderer (Vulkan) via rendering_method and rendering_method.mobile = mobile"
    not: "Forward+ (fallback only, behind gate R-1), Compatibility (OpenGL)"
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    reason: "Mid-tier Android target; fog and draw calls verified on device before the fairness numbers are trusted."
    referenced_by:
      - docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02
    revised: ""

  - purpose: distance_fog
    status: active
    api: "Environment depth fog: fog_mode depth, fog_density 1.0, fog_depth_begin/end/curve; tonemapper linear"
    not: "exponential fog, volumetric fog"
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    reason: "A fixed fully-fogged distance is needed for the F_read and T_vis fairness budget; radial distance from the eye."
    referenced_by:
      - docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02
    revised: ""

  - purpose: antialiasing
    status: active
    api: "MSAA 3D 2x default (4x measured); seam stripes use smoothstep with fwidth()"
    not: "FXAA (blurs), TAA (not on Mobile); SMAA unverified on Mobile"
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    reason: "Crisp hazard edges at the lowest cost on tile-based GPUs; MSAA does not smooth shader stripes."
    referenced_by:
      - docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02
    revised: ""

  - purpose: draw_call_measurement
    status: active
    api: "delta of RenderingServer.viewport_get_render_info(VIEWPORT_RENDER_INFO_DRAW_CALLS_IN_FRAME) after frame_post_draw, cross-checked with Android GPU Inspector or Snapdragon Profiler"
    not: "the absolute Performance.RENDER_TOTAL_DRAW_CALLS_IN_FRAME number"
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    reason: "The absolute monitor counts all passes, reads the previous frame and returns 0 headless."
    referenced_by:
      - docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02
    revised: ""

