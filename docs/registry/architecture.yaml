# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: autoload_singletons
    status: active
    description: "No autoload entries for game systems; GameRoot constructs and owns every system."
    why: "Hidden coupling, no explicit construction order, hard to inject test doubles."
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02

  - pattern: view_node_own_process
    status: active
    description: "View and driver Nodes do not run their own _process or _physics_process; GameRoot calls them."
    why: "The per-frame order is a correctness requirement and must be written in one place."
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02

  - pattern: connect_deferred_control_signals
    status: active
    description: "Control signals (run_*, hit_reported, window_*) are never connected with CONNECT_DEFERRED."
    why: "Deferred handlers run after emit() returns and escape the re-entrancy guards and the pinned order."
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02

  - pattern: engine_time_scale_writes
    status: active
    description: "No code writes Engine.time_scale."
    why: "Run State derives time from the real clock; hit-stop is a real-time hold of effects, not a time scale."
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02

  - pattern: scene_tree_paused_for_pause
    status: active
    description: "Pause, Hit and Resuming freeze the world through dt_eff = 0, never through SceneTree.paused."
    why: "The tick must keep running for Tilt polling, the restart lock and the HUD."
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02

  - pattern: physics_process_game_logic
    status: active
    description: "No game-logic code runs in _physics_process."
    why: "Engine may run several physics steps per frame; polling and collision must follow the rendered frame."
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02


  - pattern: engine_glow_for_gameplay_effects
    status: active
    description: "WorldEnvironment glow is off in the MVP; the PB bloom and near-miss ring are shader terms or overlay opacity."
    why: "Glow ordering changed in 4.6 and its Mobile cost is unmeasured; effects must not change the fog and contrast numbers."
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02

  - pattern: realtime_shadows
    status: active
    description: "No light casts shadows; tube cast_shadow is off."
    why: "Draw-call and GPU budget; the flat-shaded look comes from the material."
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02

  - pattern: compositor_effects_mvp
    status: active
    description: "No Compositor / CompositorEffect post-processing in the MVP."
    why: "Extra full-screen passes on Mobile are unmeasured and would alter measured contrast."
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02

  - pattern: unique_mesh_or_material_per_tube_slot
    status: active
    description: "Every tube slot references the same Mesh and the same Material resource."
    why: "Keeps the draw-call count predictable and the seam uniform shared."
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02

  - pattern: opengl_renderer_fallback
    status: active
    description: "The OpenGL (Compatibility) fallback is disabled; a device that is not running the mobile renderer is blocked at boot."
    why: "Fog and glow differ under Compatibility and invalidate Environment F1."
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02


  - pattern: sensor_reads_outside_tilt_input
    status: active
    description: "Only tilt_input.gd calls Input.get_gravity, get_accelerometer, get_gyroscope or get_magnetometer."
    why: "One owner for sign, units, availability and the poll clock."
    adr: docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    added: 2026-10-02

  - pattern: mouse_event_in_tap_catcher
    status: active
    description: "The Hit tap catcher never reads InputEventMouseButton (the emulated duplicate of a touch)."
    why: "One tap must give exactly one action."
    adr: docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    added: 2026-10-02

  - pattern: input_actions_for_gameplay
    status: active
    description: "Gameplay never reads Input.is_action_*; steering comes from TiltInput and taps from the Controls."
    why: "Single input pipeline; the editor-only synthetic sensor is the only desktop path."
    adr: docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    added: 2026-10-02

  - pattern: touch_index_filter
    status: active
    description: "No filtering on InputEventScreenTouch.index == 0 in the tap catcher."
    why: "A second finger is a legal restart tap; Run State's lock and idempotence absorb duplicates."
    adr: docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    added: 2026-10-02

  - pattern: debug_build_gate_for_dev_input
    status: active
    description: "The synthetic arrow-key sensor is gated on OS.has_feature(editor), never OS.is_debug_build()."
    why: "A debug APK sent to testers is still a debug build; the path must never be reachable in an export."
    adr: docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    added: 2026-10-02

  - pattern: extra_sensor_flags
    status: active
    description: "No ProjectSettings sensor flag other than input_devices/sensors/enable_gravity is true."
    why: "Unused sensors cost battery; the lint asserts it."
    adr: docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    added: 2026-10-02


  - pattern: pause_resume_as_pause_signal
    status: active
    description: "NOTIFICATION_APPLICATION_PAUSED and RESUMED are not used as the pause or resume signal."
    why: "FOCUS_OUT and FOCUS_IN cover the cases; PAUSED reliability under Vulkan is unverified."
    adr: docs/architecture/adr-0006-android-platform-integration.md
    added: 2026-10-02

  - pattern: always_deferred_lifecycle_flush
    status: active
    description: "The app_backgrounded flush is not marshalled with call_deferred when already on the main thread."
    why: "A deferred call may not run before the OS suspends the process."
    adr: docs/architecture/adr-0006-android-platform-integration.md
    added: 2026-10-02

  - pattern: ui_cancel_for_back
    status: active
    description: "Back is not also mapped through ui_cancel or KEY_BACK."
    why: "The same press could arrive twice; the single hook is WM_GO_BACK_REQUEST."
    adr: docs/architecture/adr-0006-android-platform-integration.md
    added: 2026-10-02

  - pattern: duplicate_vulkan_uses_feature
    status: active
    description: "The manifest holds exactly one Vulkan uses-feature entry (1.1); Godot's default 1.0 entry is replaced."
    why: "Two conflicting entries give an undefined Play filter."
    adr: docs/architecture/adr-0006-android-platform-integration.md
    added: 2026-10-02

  - pattern: internet_permission_in_release
    status: active
    description: "A release build declares no INTERNET permission (VIBRATE only); the lint reads the merged manifest."
    why: "No network in the MVP; debug exports may add INTERNET, so only release builds are linted."
    adr: docs/architecture/adr-0006-android-platform-integration.md
    added: 2026-10-02

  - pattern: keystore_in_repository
    status: active
    description: "No keystore, alias or password is committed; CI decodes the keystore from a secret to a temporary path."
    why: "The repository is public; Play App Signing with an upload key."
    adr: docs/architecture/adr-0006-android-platform-integration.md
    added: 2026-10-02


  - pattern: set_value_per_drag_event
    status: active
    description: "Continuous controls (sliders) never call set_value on value_changed; they commit on drag_ended."
    why: "set_value writes the file synchronously; a drag would write about 60 times a second."
    adr: docs/architecture/adr-0007-persistence-implementation.md
    added: 2026-10-02

  - pattern: save_io_outside_save_service
    status: active
    description: "ConfigFile, FileAccess and DirAccess appear only in save_service.gd (the real SaveFs inner class); SaveCore, PersistMath, SaveFs base and fakes hold no engine calls."
    why: "One place for real I/O; the core stays testable with a fake file system."
    adr: docs/architecture/adr-0007-persistence-implementation.md
    added: 2026-10-02

  - pattern: real_filesystem_in_unit_tests
    status: active
    description: "Unit tests of SaveCore use a fake SaveFs; the real file system is touched only by SP-1, SP-2 and SP-3."
    why: "Determinism and isolation (testing standards)."
    adr: docs/architecture/adr-0007-persistence-implementation.md
    added: 2026-10-02

  - pattern: global_name_shadowing_in_save_core
    status: active
    description: "SaveCore does not declare methods named load, preload or other global utility functions; the boot entry point is boot_load."
    why: "GDScript SHADOWED_GLOBAL_IDENTIFIER: a later load(\"res://...\") inside the class would call the method."
    adr: docs/architecture/adr-0007-persistence-implementation.md
    added: 2026-10-02

