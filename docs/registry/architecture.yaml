# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: frame_clock
    status: active
    api: "Time.get_ticks_usec() through the injected clock_us Callable"
    not: "the _process engine delta (scaled by time_scale, capped near 0.133 s)"
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    reason: "Run State's stall guard needs the raw real-time interval; cores must not call Time."
    referenced_by:
      - docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02
    revised: ""

  - purpose: game_tick
    status: active
    api: "GameRoot._process (PROCESS_MODE_ALWAYS)"
    not: "_physics_process, per-node _process with process_priority"
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    reason: "One owner and one fixed order; analytic collision needs no physics step; sensor polling must follow rendered frames."
    referenced_by:
      - docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02
    revised: ""


  - purpose: renderer
    status: active
    api: "Mobile renderer (Vulkan) via rendering_method and rendering_method.mobile = mobile"
    not: "Forward+ (fallback only, behind gate R-1), Compatibility (OpenGL)"
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    reason: "Mid-tier Android target; fog and draw calls verified on device before the fairness numbers are trusted."
    referenced_by:
      - docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02
    revised: ""

  - purpose: distance_fog
    status: active
    api: "Environment depth fog: fog_mode depth, fog_density 1.0, fog_depth_begin/end/curve; tonemapper linear"
    not: "exponential fog, volumetric fog"
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    reason: "A fixed fully-fogged distance is needed for the F_read and T_vis fairness budget; radial distance from the eye."
    referenced_by:
      - docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02
    revised: ""

  - purpose: antialiasing
    status: active
    api: "MSAA 3D 2x default (4x measured); seam stripes use smoothstep with fwidth()"
    not: "FXAA (blurs), TAA (not on Mobile); SMAA unverified on Mobile"
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    reason: "Crisp hazard edges at the lowest cost on tile-based GPUs; MSAA does not smooth shader stripes."
    referenced_by:
      - docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02
    revised: ""

  - purpose: draw_call_measurement
    status: active
    api: "delta of RenderingServer.viewport_get_render_info(VIEWPORT_RENDER_INFO_DRAW_CALLS_IN_FRAME) after frame_post_draw, cross-checked with Android GPU Inspector or Snapdragon Profiler"
    not: "the absolute Performance.RENDER_TOTAL_DRAW_CALLS_IN_FRAME number"
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    reason: "The absolute monitor counts all passes, reads the previous frame and returns 0 headless."
    referenced_by:
      - docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02
    revised: ""


  - purpose: motion_sensor_source
    status: active
    api: "Input.get_gravity() (Android gravity sensor, m/s^2, float32)"
    not: "get_accelerometer(), get_gyroscope(), get_magnetometer(), a native sensor plugin"
    adr: docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    reason: "One low-noise source; a device without it is 'device not supported'; revisit by a new ADR if spike V-1 shows many target devices lack it."
    referenced_by:
      - docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    added: 2026-10-02
    revised: ""

  - purpose: touch_emulation
    status: active
    api: "emulate_mouse_from_touch = true (default) so stock Buttons fire; the tap catcher reacts to InputEventScreenTouch only"
    not: "emulate_mouse_from_touch = false"
    adr: docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    reason: "BaseButton handles mouse and key events, not InputEventScreenTouch; with emulation off the buttons would be dead on a phone."
    referenced_by:
      - docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    added: 2026-10-02
    revised: ""

  - purpose: press_stamp_clock
    status: active
    api: "the injected clock_us Callable (same microsecond domain as Run State), read on the first line of the handler"
    not: "Time.get_ticks_usec() called directly in a view, any hardware event timestamp"
    adr: docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    reason: "Run State compares press_us with hit_us and paused_us; input events carry no timestamp."
    referenced_by:
      - docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    added: 2026-10-02
    revised: ""


  - purpose: lifecycle_primary_signal
    status: active
    api: "NOTIFICATION_APPLICATION_FOCUS_OUT and FOCUS_IN (focus implies suspend on Android)"
    not: "NOTIFICATION_APPLICATION_PAUSED and RESUMED (ignored; reliability under Vulkan unverified)"
    adr: docs/architecture/adr-0006-android-platform-integration.md
    reason: "FOCUS_OUT is the more sensitive trigger and fires for the shade, a call banner and split-screen focus; the stall guard is only the backup."
    referenced_by:
      - docs/architecture/adr-0006-android-platform-integration.md
    added: 2026-10-02
    revised: ""

  - purpose: lifecycle_thread_marshal
    status: active
    api: "OS.get_thread_caller_id() == OS.get_main_thread_id(): main thread calls the core synchronously, any other thread uses call_deferred"
    not: "always call_deferred (a deferred flush may not run before the OS suspends the process)"
    adr: docs/architecture/adr-0006-android-platform-integration.md
    reason: "The app_backgrounded flush must complete before suspension; PS-12 records which case occurs."
    referenced_by:
      - docs/architecture/adr-0006-android-platform-integration.md
    added: 2026-10-02
    revised: ""

  - purpose: back_hook
    status: active
    api: "NOTIFICATION_WM_GO_BACK_REQUEST only"
    not: "ui_cancel or KEY_BACK as a second path"
    adr: docs/architecture/adr-0006-android-platform-integration.md
    reason: "One press must arrive exactly once; Back not delivered on SDK 36 is a release blocker with the fallback of backgrounding the app."
    referenced_by:
      - docs/architecture/adr-0006-android-platform-integration.md
    added: 2026-10-02
    revised: ""

  - purpose: device_floor
    status: active
    api: "minSdk 28, uses-feature Vulkan 0x401000 (1.1) required, accelerometer feature required, phones only via the Play Console device catalog"
    not: "Android 7 with Vulkan 1.0; tablets and foldables as supported devices (Android 16 ignores the portrait lock on large screens)"
    adr: docs/architecture/adr-0006-android-platform-integration.md
    reason: "Fewer driver risks for the mobile renderer (ADR-0003) and a portrait-only layout."
    referenced_by:
      - docs/architecture/adr-0006-android-platform-integration.md
    added: 2026-10-02
    revised: ""


  - purpose: save_file_replace
    status: active
    api: "DirAccess.rename_absolute(tmp, real) after ConfigFile.save(tmp) returned OK and size(tmp) > 0"
    not: "writing save.cfg in place; FileAccess hand-written serializer"
    adr: docs/architecture/adr-0007-persistence-implementation.md
    reason: "App-kill safety by temp then rename; whether the replace is atomic on Android and Windows is verified by SP-1 (boot-time .tmp promotion and A/B slots are the pre-committed fallbacks)."
    referenced_by:
      - docs/architecture/adr-0007-persistence-implementation.md
    added: 2026-10-02
    revised: ""

  - purpose: save_type_check
    status: active
    api: "typeof(stored) == typeof(caller default); an int stored where a float is declared is a TYPE_MISMATCH"
    not: "a per-key type table inside SaveCore"
    adr: docs/architecture/adr-0007-persistence-implementation.md
    reason: "Save never invents defaults or types for other systems' keys."
    referenced_by:
      - docs/architecture/adr-0007-persistence-implementation.md
    added: 2026-10-02
    revised: ""

  - purpose: android_auto_backup
    status: active
    api: "android:allowBackup=false in the merged release manifest (mechanism to verify: custom Gradle template likely)"
    not: "Auto Backup restoring save.cfg, .tmp or .corrupt-* files"
    adr: docs/architecture/adr-0007-persistence-implementation.md
    reason: "No cloud save in the MVP; avoids restoring a stale or other-schema file; accepted cost: the personal best does not follow the player to a new phone."
    referenced_by:
      - docs/architecture/adr-0007-persistence-implementation.md
    added: 2026-10-02
    revised: ""


  - purpose: map_resource_load
    status: active
    api: "ResourceLoader.load(path) of the authored .tres (exists() pre-check, is-type check, re-read cache mode on Retry), confined to map_loader.gd"
    not: "FileAccess or DirAccess on a res:// content file; load_threaded_request in the MVP"
    adr: docs/architecture/adr-0004-map-loader-and-mapconfig.md
    reason: "Exports convert .tres to binary behind a remap; a few KB loads synchronously in one boot frame."
    referenced_by:
      - docs/architecture/adr-0004-map-loader-and-mapconfig.md
    added: 2026-10-02
    revised: ""

  - purpose: map_ready_gate
    status: active
    api: "RunState.map_ready() is sent by the map loader only after TubeTrack.load_map returned true"
    not: "map_ready sent on partial success or by Tube Track or Menus"
    adr: docs/architecture/adr-0004-map-loader-and-mapconfig.md
    reason: "Run State leaves Boot only on a fully loaded map; a failed load keeps Boot with no events."
    referenced_by:
      - docs/architecture/adr-0004-map-loader-and-mapconfig.md
    added: 2026-10-02
    revised: ""


  - purpose: hazard_collision
    status: active
    api: "analytic swept AABB in ObstacleMath (fposmod, float64), run once per tick in GameRoot._tick after TubeTrack.advance and before NearMiss.step"
    not: "CollisionObject3D, Area3D, RayCast3D, PhysicsServer3D, a driver node with its own process"
    adr: docs/architecture/adr-0008-hazard-collision-content-format.md
    reason: "Exact, deterministic, independent of physics sub-steps; single tick domain with Ball Movement."
    referenced_by:
      - docs/architecture/adr-0008-hazard-collision-content-format.md
    added: 2026-10-02
    revised: ""

  - purpose: pattern_prng
    status: active
    api: "RandomNumberGenerator instance with explicit seed from run_id, randi_range only, own Fisher-Yates; golden-sequence test re-run on every engine upgrade and once on a device build"
    not: "randomize(), randf(), Array.shuffle(), setting state"
    adr: docs/architecture/adr-0008-hazard-collision-content-format.md
    reason: "Bit-identical chunk sequences per run_id; the integer path is the portable one (verify on device)."
    referenced_by:
      - docs/architecture/adr-0008-hazard-collision-content-format.md
    added: 2026-10-02
    revised: ""


  - purpose: test_framework
    status: active
    api: "GUT 9.x vendored under addons/gut at a pinned release; tests extend GutTest; fixtures in tests/support have no framework dependency and are referenced with preload"
    not: "gdUnit4 (pre-committed fallback only if spike T-1 fails), a custom runner, class_name as the fixture reference path in tests"
    adr: docs/architecture/adr-0009-test-framework-and-ci.md
    reason: "Matches technical preferences and the GDD fixtures; a framework switch is a mechanical port of test files."
    referenced_by:
      - docs/architecture/adr-0009-test-framework-and-ci.md
    added: 2026-10-02
    revised: ""

  - purpose: test_discovery_and_layout
    status: active
    api: ".gutconfig.json with prefix empty and suffix _test.gd; tests/unit (Logic, BLOCKING), tests/integration (Integration and Content, BLOCKING), tests/advisory (ADVISORY), device evidence under production/qa/evidence"
    not: "GUT default prefix test_ (finds no project test); real file I/O in unit tests; device-only checks written as GUT tests"
    adr: docs/architecture/adr-0009-test-framework-and-ci.md
    reason: "One folder per evidence class of the testing standards."
    referenced_by:
      - docs/architecture/adr-0009-test-framework-and-ci.md
    added: 2026-10-02
    revised: ""


  - purpose: hazard_geometry_route
    status: active
    api: "one MeshInstance3D per hazard; all pieces of a hazard merged into one ArrayMesh per HazardSpec (add_surface_from_arrays, chunk-local, z = -s_offset on the node); prism to R + D then flat top or two-slope spike; unshaded body ShaderMaterial shared by all hazards"
    not: "MultiMeshInstance3D per family, vertex-shader arc deformation, node per piece, custom_aabb"
    adr: docs/architecture/adr-0014-hazard-render-route.md
    reason: "A linear instance transform cannot give a variable angular width on a cylinder; draw cost follows hazards (34 worst case), and the silhouette covers the analytic footprint (Pillar 2)."
    referenced_by:
      - docs/architecture/adr-0014-hazard-render-route.md
    added: 2026-10-03
    revised: ""

  - purpose: camera_far_plane
    status: active
    api: "Camera far = F_rest + L, constant (derived in CameraMath from MapConfig; the speed pull of fog_depth_end never changes the projection)"
    not: "a per-frame far plane, culling code in the tick, no culling"
    adr: docs/architecture/adr-0014-hazard-render-route.md
    reason: "Fragments beyond axial F are already 100% fogged (radial distance >= axial depth), so frustum culling is invisible and bounds the visible hazard count."
    referenced_by:
      - docs/architecture/adr-0014-hazard-render-route.md
    added: 2026-10-03
    revised: ""


  - purpose: ui_dp_conversion
    status: active
    api: "display/window/stretch/mode canvas_items, scale_mode fractional, content_scale_size (0,0), Window.content_scale_factor = dpi / 160 (so layouts are written in dp)"
    not: "stretch disabled with a manual dp() on every number (fallback only if spike UI-1 fails), viewport stretch mode, a fixed base size with keep_width"
    adr: docs/architecture/adr-0011-ui-architecture.md
    reason: "HUD and Menus numbers are true dp; 48 dp targets must not drift across densities; fonts stay crisp."
    referenced_by:
      - docs/architecture/adr-0011-ui-architecture.md
    added: 2026-10-03
    revised: ""

  - purpose: ui_inert_controls
    status: active
    api: "hidden = visible false; blocked = full-screen mouse_filter STOP (scrim, backdrop, Ink cover, Hit tap catcher); gated = own is_gated flag with dimming and reason label; every non-interactive Control is IGNORE; stock Buttons inside a ScrollContainer are PASS"
    not: "mouse_behavior_recursive, Button.disabled for gating"
    adr: docs/architecture/adr-0011-ui-architecture.md
    reason: "Relies on long-stable picking behaviour; avoids an unverified 4.5 API; a STOP default on Panel and ColorRect would swallow taps."
    referenced_by:
      - docs/architecture/adr-0011-ui-architecture.md
    added: 2026-10-03
    revised: ""

  - purpose: ui_slider_in_scroll
    status: active
    api: "UiSlider extends HSlider overriding _has_point to the thumb rectangle (>= 48 x 48 dp), slider at least 48 dp tall with a horizontal margin, commit on drag_ended"
    not: "a slider whose whole row is STOP, set_value on value_changed"
    adr: docs/architecture/adr-0011-ui-architecture.md
    reason: "A drag that starts on the thumb moves the slider and any other drag scrolls (Menus Settings); fallback is a PASS wrapper with manual thumb dragging."
    referenced_by:
      - docs/architecture/adr-0011-ui-architecture.md
    added: 2026-10-03
    revised: ""


  - purpose: world_chroma_transport
    status: active
    api: "two global shader parameters (shader_globals world_chroma default 1.0, hit_grey default 0.0) declared in project.godot, read only in fragment() or the sky shader; tube, sky, prop, plinth declare both, hazard bodies only hit_grey, ball, shards and pickups neither"
    not: "per-material world_chroma uniforms (fallback only), an object flag gating a shared uniform, a post-process desaturation, Compositor"
    adr: docs/architecture/adr-0012-ball-material-and-world-chroma.md
    reason: "Exemption by construction; luminance is preserved so Environment F1 and the fairness numbers hold."
    referenced_by:
      - docs/architecture/adr-0012-ball-material-and-world-chroma.md
    added: 2026-10-03
    revised: ""

  - purpose: chroma_color_space
    status: active
    api: "chroma = luma + (c - luma) * k on LINEAR colour, luma weights 0.2126 0.7152 0.0722; CPU copies use ChromaMath.apply_srgb (srgb_to_linear, apply, linear_to_srgb) for fog_light_color and source_color uniforms"
    not: "applying the operation to sRGB colours, additive terms in EMISSION on unshaded materials"
    adr: docs/architecture/adr-0012-ball-material-and-world-chroma.md
    reason: "Authored colours are sRGB and shaders are linear; a mismatch makes fog and tube disagree (horizon line)."
    referenced_by:
      - docs/architecture/adr-0012-ball-material-and-world-chroma.md
    added: 2026-10-03
    revised: ""

  - purpose: fog_sky_settings
    status: active
    api: "fog_sky_affect 0, fog_aerial_perspective 0, fog_sun_scatter 0, fog_light_energy 1.0, ambient and reflected light sources disabled; fog_color equals the sky horizon colour (EnvConfig.validated)"
    not: "fog_sky_affect 1 (flattens the sky gradient), chroma applied twice to the sky"
    adr: docs/architecture/adr-0012-ball-material-and-world-chroma.md
    reason: "The fully fogged tube end must equal the sky behind it at every chroma and grey value."
    referenced_by:
      - docs/architecture/adr-0012-ball-material-and-world-chroma.md
    added: 2026-10-03
    revised: ""

  - purpose: presentation_time
    status: active
    api: "stamp from the injected clock_us in the event handler; elapsed_s = PresentationMath.elapsed_s(start_us, now_us) evaluated in the owning core; event shaders get a progress uniform in [0, 1]"
    not: "presentation timers that add real_dt, shader TIME, Tween or AnimationPlayer for hit, near-miss, FOV or cover effects"
    adr: docs/architecture/adr-0010-presentation-time-hit-stop-ink-cover.md
    reason: "Exact, stall-proof, refresh-rate independent and testable with a fake clock; the world freeze (dt_eff = 0) must not stop presentation."
    referenced_by:
      - docs/architecture/adr-0010-presentation-time-hit-stop-ink-cover.md
    added: 2026-10-03
    revised: ""

  - purpose: ink_cut_routes
    status: active
    api: "cut on Menu to Running and on Paused or Hit to Menu, decided only by InkCoverCore.is_cut_route from phase_changed; opaque on the tick of the change, hold 0.05 s (and at least 3 ticks), then fade out"
    not: "a cover fade-in before the phase change, a cut on Restart (Hit to Running), Resume or Boot to Menu, a request-driven cut"
    adr: docs/architecture/adr-0010-presentation-time-hit-stop-ink-cover.md
    reason: "Presentation never gates the phase change; every route is covered without route knowledge; Restart stays the instant-retry path."
    referenced_by:
      - docs/architecture/adr-0010-presentation-time-hit-stop-ink-cover.md
    added: 2026-10-03
    revised: ""

# Example:
#
# api_decisions:
#   - purpose: physics_raycast
#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # explicitly banned for this purpose
#     adr: docs/architecture/adr-0002-physics-architecture.md
#     reason: "Direct server calls avoid per-frame node overhead; 3× faster in profiling"
#     referenced_by:
#       - docs/architecture/adr-0002-physics-architecture.md
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: autoload_singletons
    status: active
    description: "No autoload entries for game systems; GameRoot constructs and owns every system."
    why: "Hidden coupling, no explicit construction order, hard to inject test doubles."
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02

  - pattern: view_node_own_process
    status: active
    description: "View and driver Nodes do not run their own _process or _physics_process; GameRoot calls them."
    why: "The per-frame order is a correctness requirement and must be written in one place."
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02

  - pattern: connect_deferred_control_signals
    status: active
    description: "Control signals (run_*, hit_reported, window_*) are never connected with CONNECT_DEFERRED."
    why: "Deferred handlers run after emit() returns and escape the re-entrancy guards and the pinned order."
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02

  - pattern: engine_time_scale_writes
    status: active
    description: "No code writes Engine.time_scale."
    why: "Run State derives time from the real clock; hit-stop is a real-time hold of effects, not a time scale."
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02

  - pattern: scene_tree_paused_for_pause
    status: active
    description: "Pause, Hit and Resuming freeze the world through dt_eff = 0, never through SceneTree.paused."
    why: "The tick must keep running for Tilt polling, the restart lock and the HUD."
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02

  - pattern: physics_process_game_logic
    status: active
    description: "No game-logic code runs in _physics_process."
    why: "Engine may run several physics steps per frame; polling and collision must follow the rendered frame."
    adr: docs/architecture/adr-0002-game-loop-composition-root.md
    added: 2026-10-02


  - pattern: engine_glow_for_gameplay_effects
    status: active
    description: "WorldEnvironment glow is off in the MVP; the PB bloom and near-miss ring are shader terms or overlay opacity."
    why: "Glow ordering changed in 4.6 and its Mobile cost is unmeasured; effects must not change the fog and contrast numbers."
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02

  - pattern: realtime_shadows
    status: active
    description: "No light casts shadows; tube cast_shadow is off."
    why: "Draw-call and GPU budget; the flat-shaded look comes from the material."
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02

  - pattern: compositor_effects_mvp
    status: active
    description: "No Compositor / CompositorEffect post-processing in the MVP."
    why: "Extra full-screen passes on Mobile are unmeasured and would alter measured contrast."
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02

  - pattern: unique_mesh_or_material_per_tube_slot
    status: active
    description: "Every tube slot references the same Mesh and the same Material resource."
    why: "Keeps the draw-call count predictable and the seam uniform shared."
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02

  - pattern: opengl_renderer_fallback
    status: active
    description: "The OpenGL (Compatibility) fallback is disabled; a device that is not running the mobile renderer is blocked at boot."
    why: "Fog and glow differ under Compatibility and invalidate Environment F1."
    adr: docs/architecture/adr-0003-renderer-and-tube-render-route.md
    added: 2026-10-02


  - pattern: sensor_reads_outside_tilt_input
    status: active
    description: "Only tilt_input.gd calls Input.get_gravity, get_accelerometer, get_gyroscope or get_magnetometer."
    why: "One owner for sign, units, availability and the poll clock."
    adr: docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    added: 2026-10-02

  - pattern: mouse_event_in_tap_catcher
    status: active
    description: "The Hit tap catcher never reads InputEventMouseButton (the emulated duplicate of a touch)."
    why: "One tap must give exactly one action."
    adr: docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    added: 2026-10-02

  - pattern: input_actions_for_gameplay
    status: active
    description: "Gameplay never reads Input.is_action_*; steering comes from TiltInput and taps from the Controls."
    why: "Single input pipeline; the editor-only synthetic sensor is the only desktop path."
    adr: docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    added: 2026-10-02

  - pattern: touch_index_filter
    status: active
    description: "No filtering on InputEventScreenTouch.index == 0 in the tap catcher."
    why: "A second finger is a legal restart tap; Run State's lock and idempotence absorb duplicates."
    adr: docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    added: 2026-10-02

  - pattern: debug_build_gate_for_dev_input
    status: active
    description: "The synthetic arrow-key sensor is gated on OS.has_feature(editor), never OS.is_debug_build()."
    why: "A debug APK sent to testers is still a debug build; the path must never be reachable in an export."
    adr: docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    added: 2026-10-02

  - pattern: extra_sensor_flags
    status: active
    description: "No ProjectSettings sensor flag other than input_devices/sensors/enable_gravity is true."
    why: "Unused sensors cost battery; the lint asserts it."
    adr: docs/architecture/adr-0005-sensor-source-and-input-pipeline.md
    added: 2026-10-02


  - pattern: pause_resume_as_pause_signal
    status: active
    description: "NOTIFICATION_APPLICATION_PAUSED and RESUMED are not used as the pause or resume signal."
    why: "FOCUS_OUT and FOCUS_IN cover the cases; PAUSED reliability under Vulkan is unverified."
    adr: docs/architecture/adr-0006-android-platform-integration.md
    added: 2026-10-02

  - pattern: always_deferred_lifecycle_flush
    status: active
    description: "The app_backgrounded flush is not marshalled with call_deferred when already on the main thread."
    why: "A deferred call may not run before the OS suspends the process."
    adr: docs/architecture/adr-0006-android-platform-integration.md
    added: 2026-10-02

  - pattern: ui_cancel_for_back
    status: active
    description: "Back is not also mapped through ui_cancel or KEY_BACK."
    why: "The same press could arrive twice; the single hook is WM_GO_BACK_REQUEST."
    adr: docs/architecture/adr-0006-android-platform-integration.md
    added: 2026-10-02

  - pattern: duplicate_vulkan_uses_feature
    status: active
    description: "The manifest holds exactly one Vulkan uses-feature entry (1.1); Godot's default 1.0 entry is replaced."
    why: "Two conflicting entries give an undefined Play filter."
    adr: docs/architecture/adr-0006-android-platform-integration.md
    added: 2026-10-02

  - pattern: internet_permission_in_release
    status: active
    description: "A release build declares no INTERNET permission (VIBRATE only); the lint reads the merged manifest."
    why: "No network in the MVP; debug exports may add INTERNET, so only release builds are linted."
    adr: docs/architecture/adr-0006-android-platform-integration.md
    added: 2026-10-02

  - pattern: keystore_in_repository
    status: active
    description: "No keystore, alias or password is committed; CI decodes the keystore from a secret to a temporary path."
    why: "The repository is public; Play App Signing with an upload key."
    adr: docs/architecture/adr-0006-android-platform-integration.md
    added: 2026-10-02


  - pattern: set_value_per_drag_event
    status: active
    description: "Continuous controls (sliders) never call set_value on value_changed; they commit on drag_ended."
    why: "set_value writes the file synchronously; a drag would write about 60 times a second."
    adr: docs/architecture/adr-0007-persistence-implementation.md
    added: 2026-10-02

  - pattern: save_io_outside_save_service
    status: active
    description: "ConfigFile, FileAccess and DirAccess appear only in save_service.gd (the real SaveFs inner class); SaveCore, PersistMath, SaveFs base and fakes hold no engine calls."
    why: "One place for real I/O; the core stays testable with a fake file system."
    adr: docs/architecture/adr-0007-persistence-implementation.md
    added: 2026-10-02

  - pattern: real_filesystem_in_unit_tests
    status: active
    description: "Unit tests of SaveCore use a fake SaveFs; the real file system is touched only by SP-1, SP-2 and SP-3."
    why: "Determinism and isolation (testing standards)."
    adr: docs/architecture/adr-0007-persistence-implementation.md
    added: 2026-10-02

  - pattern: global_name_shadowing_in_save_core
    status: active
    description: "SaveCore does not declare methods named load, preload or other global utility functions; the boot entry point is boot_load."
    why: "GDScript SHADOWED_GLOBAL_IDENTIFIER: a later load(\"res://...\") inside the class would call the method."
    adr: docs/architecture/adr-0007-persistence-implementation.md
    added: 2026-10-02


  - pattern: apply_map_with_side_effects
    status: active
    description: "Environment.apply_map, Obstacle.apply_map and Pattern.apply_map are configuration only: no signal, no generation, no visible change before the Menu exists."
    why: "A failed attempt must leave only inert, idempotent state that Retry overwrites."
    adr: docs/architecture/adr-0004-map-loader-and-mapconfig.md
    added: 2026-10-02

  - pattern: map_content_file_io
    status: active
    description: "A res:// map or content resource is never opened with FileAccess or listed with DirAccess; ResourceLoader appears only in map_loader.gd."
    why: "Export converts text resources to binary behind a remap."
    adr: docs/architecture/adr-0004-map-loader-and-mapconfig.md
    added: 2026-10-02

  - pattern: mutate_cached_map_resource
    status: active
    description: "Loaded MapDefinition, EnvConfig and the chunk library are never written; validated() returns a copy, MapConfig keeps the copy, never def.env."
    why: "ResourceLoader may cache and share the instance."
    adr: docs/architecture/adr-0004-map-loader-and-mapconfig.md
    added: 2026-10-02

  - pattern: non_scalar_tube_config_field
    status: active
    description: "TubeConfig and EnvConfig hold only scalars, enums and Colors; no Resource, Array or Dictionary field; no EnvConfig back-reference to MapDefinition or MapConfig."
    why: "Shallow Resource.duplicate() would share state; circular references."
    adr: docs/architecture/adr-0004-map-loader-and-mapconfig.md
    added: 2026-10-02


  - pattern: engine_physics_for_hazards
    status: active
    description: "No CollisionObject3D, Area3D, RayCast3D, ShapeCast3D or PhysicsServer calls in hazard, obstacle, near-miss or pattern code."
    why: "The hit test is analytic and deterministic."
    adr: docs/architecture/adr-0008-hazard-collision-content-format.md
    added: 2026-10-02

  - pattern: copy_or_mutate_hazard_resources
    status: active
    description: "No duplicate(), duplicate_deep() or write on a loaded ChunkLibrary, ChunkDef, HazardPlacement or HazardPiece, nor on a compiled HazardSpec."
    why: "Authored Resources come from the ResourceLoader cache; runtime specs are immutable and shared."
    adr: docs/architecture/adr-0008-hazard-collision-content-format.md
    added: 2026-10-02

  - pattern: float32_footprints
    status: active
    description: "Footprints use PackedFloat64Array and float; never Vector2, Vector3 or Vector4 (single precision in default builds)."
    why: "The approved formulas and margins assume float64."
    adr: docs/architecture/adr-0008-hazard-collision-content-format.md
    added: 2026-10-02

  - pattern: pattern_global_rng_or_float_draw
    status: active
    description: "Pattern code does not call randomize(), randf(), randf_range or the global Array.shuffle()."
    why: "Determinism per run_id; float conversion is the fragile part across platforms."
    adr: docs/architecture/adr-0008-hazard-collision-content-format.md
    added: 2026-10-02

  - pattern: spacing_history_without_spikes
    status: active
    description: "The sequencer's read history holds every read including Spikes (empty solution set) and pads by max(S_MIN_SPACING, DODGE_RECOVERY_S if opposing) and footprint clearance D."
    why: "A Spike or a non-opposing chunk next to the previous chunk could otherwise violate spacing and overlap at the boundary."
    adr: docs/architecture/adr-0008-hazard-collision-content-format.md
    added: 2026-10-02


  - pattern: skip_or_retry_failing_tests
    status: active
    description: "No pending, skip, disabled test or CI retry to obtain a green run; a failing or flaky test is fixed or deleted with a written reason."
    why: "CI rules: never disable or skip a failing test; a retry hides flakiness."
    adr: docs/architecture/adr-0009-test-framework-and-ci.md
    added: 2026-10-02

  - pattern: unpinned_ci_dependency
    status: active
    description: "GitHub Actions are pinned to a commit SHA; the Godot archive is verified against a SHA-512 committed by hand; GUT is vendored; no third-party Godot container image."
    why: "Public repository supply-chain surface."
    adr: docs/architecture/adr-0009-test-framework-and-ci.md
    added: 2026-10-02

  - pattern: secrets_in_ci
    status: active
    description: "The CI workflow uses no secrets and has permissions contents: read; keystores are decoded only in a separate, reviewed export workflow."
    why: "The repository is public."
    adr: docs/architecture/adr-0009-test-framework-and-ci.md
    added: 2026-10-02

  - pattern: framework_base_in_test_support
    status: active
    description: "tests/support fixtures and fakes extend no GUT class and call no GUT function; names do not collide with GUT classes (Double, Spy)."
    why: "A framework switch must touch only *_test.gd files."
    adr: docs/architecture/adr-0009-test-framework-and-ci.md
    added: 2026-10-02

  - pattern: trust_godot_exit_code
    status: active
    description: "A Godot run is trusted only after the JUnit XML check (present, more than zero tests, executed count at least the number of test files, zero failures) and a scan for SCRIPT ERROR and Parse Error."
    why: "A parse error can skip a test file and still exit 0."
    adr: docs/architecture/adr-0009-test-framework-and-ci.md
    added: 2026-10-02

  - pattern: lint_ignore_comment
    status: active
    description: "A lint is silenced only by an allowlist field in lint_rules.json, never by an inline ignore comment in source."
    why: "Suppressions must be reviewable in one place."
    adr: docs/architecture/adr-0009-test-framework-and-ci.md
    added: 2026-10-02


  - pattern: hazard_node_per_piece
    status: active
    description: "No MeshInstance3D per HazardPiece; one node per hazard with all pieces merged into one mesh."
    why: "Draw cost must follow hazards, not pieces (12 pieces per segment would exceed the 40 allocation), and the killer isolate needs one node per hazard."
    adr: docs/architecture/adr-0014-hazard-render-route.md
    added: 2026-10-03

  - pattern: hazard_multimesh_arc_deform
    status: active
    description: "No MultiMesh or vertex-shader deformation for hazards."
    why: "Silhouette must equal the collision footprint and the Mobile path is unverified."
    adr: docs/architecture/adr-0014-hazard-render-route.md
    added: 2026-10-03

  - pattern: hazard_mesh_built_in_tick
    status: active
    description: "ArrayMesh for hazards is created only in HazardView.apply_map; never at bind or in a tick."
    why: "No allocation or hitch during a run; a bad mesh must fail at map load."
    adr: docs/architecture/adr-0014-hazard-render-route.md
    added: 2026-10-03

  - pattern: hazard_material_override_whole
    status: active
    description: "No material_override on a hazard node; per-hazard variation uses instance uniforms or set_surface_override_material(0, ...)."
    why: "material_override replaces every surface and would repaint the Double Gate plinth."
    adr: docs/architecture/adr-0014-hazard-render-route.md
    added: 2026-10-03

  - pattern: hazard_mesh_winding_untested
    status: active
    description: "HazardMeshBuilder output must pass the per-face winding test (clockwise front face) and invariants I1 to I3 before any hazard mesh change merges."
    why: "A wrong winding under cull_back makes a hazard invisible; the silhouette invariant is the Pillar 2 guarantee."
    adr: docs/architecture/adr-0014-hazard-render-route.md
    added: 2026-10-03


  - pattern: mouse_behavior_recursive_in_mvp
    status: active
    description: "No use of mouse_behavior_recursive (or the recursive focus property) in the MVP."
    why: "visible = false and STOP blockers already cover every case; the 4.5 API is unverified on 4.7.2."
    adr: docs/architecture/adr-0011-ui-architecture.md
    added: 2026-10-03

  - pattern: button_disabled_for_gating
    status: active
    description: "View code never sets Button.disabled to gate a control; it uses the own is_gated flag, dimming and the reason label."
    why: "Menus rules: gated controls stay visible with a reason and a gated tap is still received."
    adr: docs/architecture/adr-0011-ui-architecture.md
    added: 2026-10-03

  - pattern: literal_canvas_layer_index
    status: active
    description: "CanvasLayer.layer is assigned only from UiLayers constants, never a numeric literal."
    why: "One stack order for flash, HUD, Menus and the Ink cover."
    adr: docs/architecture/adr-0011-ui-architecture.md
    added: 2026-10-03

  - pattern: accessibility_properties_outside_ui_access
    status: active
    description: "accessibility_* properties and DisplayServer.accessibility_* appear only in ui_access.gd."
    why: "AccessKit scope on Android is unverified; one place to change after spike UI-A1."
    adr: docs/architecture/adr-0011-ui-architecture.md
    added: 2026-10-03

  - pattern: noninteractive_control_stop_filter
    status: active
    description: "A non-interactive Control (pill background, row, container, Hit flash ColorRect) never keeps mouse_filter STOP; only buttons, sliders, scrims, the tap catcher and the Ink cover are STOP."
    why: "Panel, PanelContainer and ColorRect default to STOP and would swallow taps and scroll drags."
    adr: docs/architecture/adr-0011-ui-architecture.md
    added: 2026-10-03


  - pattern: global_param_write_outside_render_globals
    status: active
    description: "RenderingServer.global_shader_parameter_set appears only in render_globals.gd; no global_shader_parameter_add for names declared in project.godot."
    why: "One call site, on the engine-call allowlist; an undeclared or duplicate name errors every frame."
    adr: docs/architecture/adr-0012-ball-material-and-world-chroma.md
    added: 2026-10-03

  - pattern: world_chroma_uniform_in_exempt_shader
    status: active
    description: "The hazard body, ball, shard and UI shaders never declare world_chroma; ball, shard and UI shaders never declare hit_grey either."
    why: "Exemption must be structural, not an object flag."
    adr: docs/architecture/adr-0012-ball-material-and-world-chroma.md
    added: 2026-10-03

  - pattern: chroma_function_drift
    status: active
    description: "The chroma function block is copied per shader and must be textually identical to the canonical snippet (lint); no #include in shaders."
    why: "4.7 preprocessor restrictions; the CPU fixture test cannot catch a drifted shader copy."
    adr: docs/architecture/adr-0012-ball-material-and-world-chroma.md
    added: 2026-10-03

  - pattern: ball_material_second_writer
    status: active
    description: "No system other than BallView writes the ball material; Environment uses set_luminance_target and Juice uses set_rim_glow and set_ball_visible, through Callable sinks."
    why: "One owner and one writer per material."
    adr: docs/architecture/adr-0012-ball-material-and-world-chroma.md
    added: 2026-10-03

  - pattern: shader_time_for_effects
    status: active
    description: "No shader (assets/shaders/** or a particle process material) reads TIME for an effect; event effects use a progress uniform written by their core."
    why: "TIME keeps advancing while dt_eff = 0 and cannot be driven by a fake clock."
    adr: docs/architecture/adr-0010-presentation-time-hit-stop-ink-cover.md
    added: 2026-10-03

  - pattern: presentation_timer_accumulates_dt
    status: active
    description: "No presentation effect adds real_dt or an engine delta to a timer; effects use stamps from clock_us."
    why: "Accumulation drifts with dropped frames and breaks on a stall."
    adr: docs/architecture/adr-0010-presentation-time-hit-stop-ink-cover.md
    added: 2026-10-03

  - pattern: ink_cover_cleared_by_run_reset
    status: active
    description: "run_reset never clears or re-stamps InkCoverCore."
    why: "Play fires run_reset, run_started and phase_changed in one tick; the cover must survive the reset."
    adr: docs/architecture/adr-0010-presentation-time-hit-stop-ink-cover.md
    added: 2026-10-03

  - pattern: world_change_outside_tick
    status: active
    description: "No call_deferred, Tween callback or await moves the tube or changes the seam phase; every world change happens inside GameRoot._tick."
    why: "The first presented frame after phase_changed is covered only if the jump and the cover write land in the same draw."
    adr: docs/architecture/adr-0010-presentation-time-hit-stop-ink-cover.md
    added: 2026-10-03

