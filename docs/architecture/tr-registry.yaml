    gdd: design/gdd/tube-track.md
    category: "Timing"
    requirement: "advance(s) has exactly one caller, once per frame, valid only in Running; s never decreases (max(s,prev)); equal s is a silent no-op; NaN/INF s is ignored with an error"
    source: "R4, EC"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-tube-track-007
    system: tube-track
    gdd: design/gdd/tube-track.md
    category: "Timing"
    requirement: "Recycling is synchronous inside advance: left(rearmost) then entered(new far) per boundary, in increasing index order; a jump of >=N segments re-primes with window_primed and no segment_* signals"
    source: "R6, F2"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-tube-track-008
    system: tube-track
    gdd: design/gdd/tube-track.md
    category: "Core"
    requirement: "Signals carry integers only and re-entrancy is guarded: a mutating call from any handler is rejected with an error; immediate connections only (CONNECT_DEFERRED bypasses the guard)"
    source: "Interactions, OQ18"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-tube-track-009
