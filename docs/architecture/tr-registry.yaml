    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "SaveLoad"
    requirement: "Persistent state: none owned. Setting values persist only through Settings.set_value into Save & Persistence"
    source: "Rule 4"
    created: 2026-10-03
    revised: ""
    status: active
