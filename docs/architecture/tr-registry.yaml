  - id: TR-obstacle-system-001
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Core"
    requirement: "Logic is split into static pure `ObstacleMath` (F1 expansion, F2 swept overlap + `arc_overlap`, F3 gap sweep-line, F4 `hidden()`, F5 spacing), `RefCounted` `ObstacleCore` and a data-driven `ObstacleConfig` Resource with `validated(log_sink)`."
    source: "Acceptance Criteria Targets, Tuning Knobs"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-002
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Core"
    requirement: "A hazard is `{hazard_id:int>=0, footprint_pieces:[(theta_min,theta_max,s_start,s_end)], home_segment}`. Pieces of one hazard share one id. Raw `s`-range of every piece lies inside `[i*L,(i+1)*L)`. No height dimension."
    source: "CR1"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-003
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Physics"
    requirement: "The hit test is analytic (no `CollisionObject3D`/`Area3D`/`PhysicsServer3D`). It is a swept AABB: `s_hit = s_prev<=s_eff_end and s>=s_eff_start`, and `theta_hit = arc_overlap(...)` using a single `fposmod`. Bounds are expanded by `BALL_HALF_ANGLE = asin(D/(2(R+D/2)))` and `D/2`."
    source: "CR2, F1, F2"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-004
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Timing"
    requirement: "The test runs exactly once per published `(theta_prev,theta,s_prev,s)` pair, in the same tick domain as Ball Movement's publish. A driver node owns this guarantee. A render-frame-only callback is forbidden because of physics catch-up."
    source: "CR2, OQ16, AC-25"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-005
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Core"
    requirement: "Reporting is level-triggered. One `hit_reported(hazard_id:int, run_id:int)` is sent per overlapped hazard per tick, in every phase, with no phase awareness (a no-op frame degenerates to a point-in-footprint test)."
    source: "CR3, CR4, AC-16, AC-17, AC-18"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-006
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Core"
    requirement: "Lifecycle follows Tube Track's signals. `segment_entered_window(i)` calls the provider once and spawns hazards. `segment_left_window(i)` releases them. `window_primed(first,last)` releases everything, then populates `[first,last]` in increasing order and restarts the `hazard_id` counter at 0."
    source: "CR5, AC-19, AC-20, AC-21"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-007
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Core"
    requirement: "Obstacle System emits `hazard_bound(hazard_id, footprint_pieces)` on spawn and `hazard_released(hazard_id, released_by_reset: bool)` on release. The flag is true for any `window_primed`-caused release (reset, re-prime, to-idle) and false for a `segment_left_window` recycle. No release event exists for `unload_map`."
    source: "CR5, Interactions, AC-40"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-008
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Core"
    requirement: "The `run_reset(run_id)` handler only stores `run_id`. It must not clear, reseed or reset the id counter, so either order within rank 2 is safe."
    source: "CR5, AC-41"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-009
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Data"
    requirement: "The content seam is `HazardContentProvider.hazards_for_segment(segment_index:int) -> Array[HazardSpec]`. It is called once per entering segment and never re-queried (a second call gives `DUPLICATE_SEGMENT_QUERY`, binding untouched). The provider may be stateful. Swapping providers needs no core change."
    source: "CR7, EC, AC-14"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-010
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Data"
    requirement: "If `HazardSpec` is a Resource, each spawned hazard gets an owned deep copy. Plain `duplicate()` is shallow."
    source: "CR7"
    created: 2026-10-03
    revised: ""
    status: active
    note: "ADR-0008 (Proposed) changes the mechanism: HazardSpec is a shared immutable RefCounted, no per-hazard copy and no duplicate_deep(). Requirement text stays until the Obstacle GDD is revised; do not deprecate before ADR-0008 is Accepted."
  - id: TR-obstacle-system-011
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Data"
    requirement: "Footprint bounds are unwrapped reals with `theta_min<=theta_max` and width `<2*PI`. A seam-crossing piece is authored with `theta_max>PI` or `theta_min<-PI`. Bounds are wrapped only when compared to the ball."
    source: "F1, F2, AC-4"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-012
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Core"
    requirement: "An offline preflight runs over the whole library, exhaustively (not fail-fast), in deterministic order. It emits stable codes and structured records: `FOOTPRINT_NOT_FINITE`, `FOOTPRINT_INVALID_ORDER`, `FOOTPRINT_TOO_WIDE`, `FOOTPRINT_EFF_TOO_WIDE`, `HOME_SEGMENT_MISMATCH`, `NO_SAFE_GAP` (record: s0 + active piece set), `TOO_MANY_PIECES`, `TOO_DENSE`, `HAZARD_OVERLAP`, `HIDDEN_CONTENT_FORBIDDEN`, `EXIT_BEYOND_VISIBLE_ARC`, `HIDDEN_UNFAIR`, `GRACE_ZONE_VIOLATION`, `SWEEP_INVARIANT_VIOLATED`. A failing segment is never partially applied."
    source: "EC, F3, F5"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-013
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Core"
    requirement: "The live `hazards_for_segment` call may re-run the checks only as a debug-build assertion. It never rejects mid-run."
    source: "EC \"When validation runs\""
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-014
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Core"
    requirement: "`hidden(piece)` uses `d_min>VISIBLE_ARC_HALF_WIDTH` with `fposmod` (never `wrapf`) and strict `>`. The hidden ban stays active until OQ2/OQ15 resolve. The exit rule requires a type with `theta_solution` and `d_exit>VISIBLE_ARC_HALF_WIDTH` to be PI-symmetric (1e-6 tolerance)."
    source: "CR8, F4, AC-34, AC-36, AC-42"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-015
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Core"
    requirement: "A non-finite published `theta` or `s` is a no-op frame (last good swept endpoint held) with one error logged, and never reaches a comparison."
    source: "EC, AC-22"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-016
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Core"
    requirement: "The cross-system invariant `OMEGA_MAX*DT_MAX<PI` is validated at load with `OMEGA_MAX` and `DT_MAX` injected (not owned)."
    source: "EC, F2, AC-13"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-017
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Timing"
    requirement: "Per-tick work is bounded by `MAX_PIECES_PER_SEGMENT`=12 (safe range 6-20) times at most `N_MAX`=16 window segments, which is at most 192 pieces tested every tick. The test is its own broad phase. No numeric ms budget is stated."
    source: "CR2, EC, Tuning Knobs"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-018
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Core"
    requirement: "No side effects: the only output is `hit_reported` (plus the two Near-Miss signals). Obstacle System reads only `theta`/`s` and their prev values (never raw world Z). It never calls mutating Ball Movement or Tube Track methods."
    source: "CR9"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-019
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Testing"
    requirement: "A lint over ObstacleMath/Core/Config and their transitive dependencies bans `CollisionObject3D`, `CharacterBody3D`, `Area3D`, `RayCast3D`, `ShapeCast3D`, `PhysicsServer`, `Input.`, `Engine.`, `Time.`, `OS.`, `DisplayServer.`, `get_tree`, `_process`, `_physics_process`, `randi*`, `randf*`, `randomize`, `seed(`, `RandomNumberGenerator`, `position.z`, `global_position.z`, `global_transform.origin`. Code review sign-off is required evidence."
    source: "AC-24"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-020
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Testing"
    requirement: "Tests are driven by `make_obstacle_fixture()`, `make_ball_state_stub`, `make_content_provider(table)` and `make_core(cfg, provider, log_sink)`, using scripted ticks only. Exact `==` for ints and codes, 1e-6 for floats. Files are `tests/unit/obstacle_system/obstacle_system_[feature]_test.gd`. Fixture: R 3.0, D 0.8, L 12, v_max 25, OMEGA_MAX 3.0, DT_MAX 0.1."
    source: "Acceptance Criteria"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-021
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Core"
    requirement: "Determinism: no randomness; two instances fed the same 500-tick script give bit-identical `hit_reported` streams; no static shared state."
    source: "CR6, AC-23"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-022
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Timing"
    requirement: "A hazard that hit the ball stays bound through the Hit freeze. Recycling happens only inside `advance()` in Running."
    source: "Visual/Audio, EC"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-023
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "Rendering"
    requirement: "Hazards render at full silhouette and chroma the instant they enter the visible arc (no fade, alpha ramp or LOD pop-in). A developer-only debug overlay drawing every effective footprint is required before chunk authoring. Draw calls are at most 150 total (art bible: about 60 tris per family)."
    source: "Visual/Audio, UI Requirements"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-obstacle-system-024
    system: obstacle-system
    gdd: design/gdd/obstacle-system.md
    category: "SaveLoad"
    requirement: "No persisted state. Config lives in `ObstacleConfig.tres`: `GAP_MARGIN` 2.5 (2.0-3.5), `T_REVEAL_MIN` 1.5, `HIDDEN_SPAN_MIN_TIME` 1.44, `MAX_PIECES_PER_SEGMENT` 12."
    source: "Tuning Knobs, AC-30"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-001
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "Core"
    requirement: "Logic is split into static `PatternMath` (F1 tier, F2 opposing/spacing, F3 cost ratio, F4 bag bounds), `PatternCore` (RefCounted: provider impl, seeded RNG, bags, read history, padding), and `PatternConfig.validated(log_sink)` (library preflight)."
    source: "Acceptance Criteria Targets"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-002
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "Data"
    requirement: "Chunk record: `{chunk_id, tier, segment_count 1-3, hazard_placements:[(local_segment_index, hazard_type, footprint_pieces)]}` in chunk-local coordinates. At `base`, pieces are translated by `base*L` in `s`. Whole-segment alignment is forced by Obstacle's `HOME_SEGMENT_MISMATCH`. MVP types: Wall, Spike, Double Gate, Near-Ring."
    source: "CR1, CR4, AC-2, AC-7"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-003
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "Data"
    requirement: "PatternCore is the `HazardContentProvider`: `hazards_for_segment(index)` returns empty for `index<0`, the next local segment's translated pieces mid-chunk, empty while padding, else it draws a new chunk."
    source: "CR5, States table, AC-8"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-004
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "Core"
    requirement: "Tier is a pure function of `run_time`: INTRO `<TIER_INTRO_DURATION`, RAMP `<TIER_RAMP_DURATION`, FULL after, with the upper boundary inclusive. Pools are supersets (RAMP includes INTRO, FULL includes all). Tier changes lazily at the next chunk draw and never truncates a chunk."
    source: "CR2, F1, AC-1, AC-3"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-005
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "Core"
    requirement: "Per tier, a bag is shuffled with a PRNG seeded from `run_id`, drawn without replacement, and reshuffled on empty. The reshuffled first draw must differ from the previous last draw (waived at N=1). `min_gap`=2, `max_gap`=2N-1 for N>=3, fixed 2 at N=2."
    source: "CR3, F4, AC-4, AC-5, AC-6, AC-15, AC-31"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-006
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "Core"
    requirement: "The PRNG is a `RandomNumberGenerator` with an explicit `seed` set from `run_id` before the first draw, never `randomize()`. Fisher-Yates is implemented by the module itself (the shuffle must use this RNG instance)."
    source: "CR3, CR11, AC-24"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-007
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "Core"
    requirement: "On `run_reset(run_id)` Pattern reseeds, reshuffles all three bags, discards in-progress chunk state and clears the read history. It must run first among `run_reset` subscribers."
    source: "States table, AC-20"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-008
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "Core"
    requirement: "The first chunk draw of a run is restricted to grace-compliant INTRO chunks (translated `s_start>=11` at base 0). Later draws are unrestricted. `GRACE_POOL_TOO_SMALL` requires at least 2 compliant chunks."
    source: "CR6, AC-9, AC-9b"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-009
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "Core"
    requirement: "The preflight inherits Obstacle's gates. Every authored piece must pass `HIDDEN_CONTENT_FORBIDDEN` (per piece) and `EXIT_BEYOND_VISIBLE_ARC` (per `theta_solution`)."
    source: "CR7, AC-10"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-010
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "Core"
    requirement: "Solution angles: Wall and Near-Ring have one (gap midpoint), Double Gate has two, Spike has none (exempt). Two reads are opposing if any angle pair has `abs(delta_theta)>ANGULAR_REVERSAL_THRESHOLD` (strict `>`). Opposing pairs need `s_start` distance `>=DODGE_RECOVERY_S = T_DODGE_180*v_max`. A within-chunk violation gives `DODGE_RECOVERY_VIOLATION`."
    source: "CR8, F2, AC-11, AC-12b, AC-12c"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-011
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "Core"
    requirement: "Cross-chunk spacing is enforced by sequencer padding. A pruned read history holds `(s_start, theta_solution_set)` for non-Spike reads (pruned to `s_start >= frontier - DODGE_RECOVERY_S`). Every non-Spike read of a drawn chunk is checked against every history entry. `padding_segments = ceil(max_shortfall/L)` empty segments are inserted before the chunk. It never redraws, reorders or rejects."
    source: "CR9, F2c, AC-12, AC-13"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-012
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "Core"
    requirement: "F3 must delegate to Ball Movement's `BallMath.T` (three-branch F5a), not restate the middle branch (NaN/wrong value when `BALL_LAG_TAU<=eps/OMEGA_MAX`)."
    source: "F3, AC-30"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-013
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "Core"
    requirement: "The pool clustering statistic `opposing_pair_fraction` is computed per tier. A value above `MAX_OPPOSING_FRACTION` logs an ADVISORY `EXCESSIVE_ANGULAR_CLUSTERING` (load still succeeds). It is 0.0 (no NaN) when fewer than 2 non-Spike chunks."
    source: "CR12, F5, AC-28, AC-29, AC-29b"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-014
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "Data"
    requirement: "Config guards: `TIER_ORDER_INVALID`, `TIER_DURATION_OUT_OF_RANGE` (intro 8-20, ramp 45-240, checked first), `ANGULAR_THRESHOLD_OUT_OF_RANGE`. `t_dodge_worst` = `T_DODGE_180` is supplied to Tube Track as a config value, never derived per chunk."
    source: "F1, CR10, AC-1b, AC-1c, AC-16"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-015
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "Core"
    requirement: "Determinism: the same `run_id` and the same call script give bit-identical chunk sequences. A different `run_id` changes the first draw. No side effects; Run State and Tube Track are read-only."
    source: "CR11"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-016
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "Timing"
    requirement: "Obstacle must call `hazards_for_segment` in increasing index order, once each. PatternCore state (mid-chunk, mid-padding) depends on call order. Tier is sampled at window-entry time (ahead of the ball)."
    source: "States table, F2c"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-017
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "Timing"
    requirement: "Per-call cost is small (bag draw plus history check against a short pruned history). No explicit budget is given."
    source: "F2c"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-018
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "Testing"
    requirement: "Lint bans the engine-coupling tokens except `RandomNumberGenerator` with an explicit seed (the lint must verify seed-before-first-draw). The 8-chunk fixture with INTRO={W1-W4}, RAMP=+{SP1,DG1}, FULL=+{NR1,REV2} drives the tests, plus micro-fixtures TWOHOP, TOO_CLOSE, TWIN_WALL and CLUSTERED. Files are `pattern_difficulty_[feature]_test.gd`."
    source: "Acceptance Criteria"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-019
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "Testing"
    requirement: "The statistical shuffle-fairness test is ADVISORY: chi-square over 500 `run_id`s, N=8, p>0.01. Use a fixed hardcoded seed list, not generated seeds."
    source: "F4"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-020
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "SaveLoad"
    requirement: "No persistence. All chunk and sequence state is per-run and in-memory."
    source: "CR11"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-pattern-difficulty-021
    system: pattern-difficulty
    gdd: design/gdd/pattern-difficulty.md
    category: "Data"
    requirement: "The chunk-library data format is only logically specified (the record in TR-002). The on-disk format and the `PatternConfig.tres` fields beyond the three knobs are not fixed."
    source: "CR1, Provisional assumptions"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-near-miss-detection-001
    system: near-miss-detection
    gdd: design/gdd/near-miss-detection.md
    category: "Core"
    requirement: "Logic is split into static `NearMissMath` (F1-NM, a two-call wrapper that calls `ObstacleMath` F2, and the F3-NM validator), `NearMissCore` (RefCounted with `log_sink` and read-only accessors), and `NearMissConfig.validated(log_sink)`."
    source: "Acceptance Criteria Targets"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-near-miss-detection-002
    system: near-miss-detection
    gdd: design/gdd/near-miss-detection.md
    category: "Core"
    requirement: "Per-hazard state is `{hit_ever_true, was_in_near_zone}` keyed by `hazard_id`, created on `hazard_bound` and discarded on `hazard_released`."
    source: "CR1, States table"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-near-miss-detection-003
    system: near-miss-detection
    gdd: design/gdd/near-miss-detection.md
    category: "Physics"
    requirement: "`near_zone = hit_zone expanded by NEAR_MISS_ANGLE_MARGIN = COEFF*BALL_HALF_ANGLE` and `NEAR_MISS_S_MARGIN = COEFF*D/2`. `NEAR_MISS_CANDIDATE = NEAR_ZONE and not HIT_ZONE`. The swept values `dtheta/swept_start/swept_width` are computed once per frame and shared. `ObstacleMath` is reused, never reimplemented."
    source: "CR2, CR3, F1-NM, F2, AC-22"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-near-miss-detection-004
    system: near-miss-detection
    gdd: design/gdd/near-miss-detection.md
    category: "Core"
    requirement: "Output is edge-triggered: exactly one `near_miss_detected(hazard_id:int, run_id:int)` on the near-zone true->false edge, or on a release with `released_by_reset==false`. Never fires while merely inside the zone (no output across stationary ticks)."
    source: "CR5, CR8"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-near-miss-detection-005
    system: near-miss-detection
    gdd: design/gdd/near-miss-detection.md
    category: "Core"
    requirement: "A hit overrides: `hit_reported` sets `hit_ever_true`, and the hazard never emits a near-miss. Within a tick, `hit_reported` is applied before the exit-edge check, regardless of driver delivery order."
    source: "CR4"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-near-miss-detection-006
    system: near-miss-detection
    gdd: design/gdd/near-miss-detection.md
    category: "Core"
    requirement: "A release with `released_by_reset==true` emits nothing (reset, re-prime, to-idle, Paused to Restart/Menu). Suppression is at the source."
    source: "CR5, EC, AC-28"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-near-miss-detection-007
    system: near-miss-detection
    gdd: design/gdd/near-miss-detection.md
    category: "Core"
    requirement: "One report per hazard, not per piece (multi-piece hazards share one state entry)."
    source: "CR6, AC-15"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-near-miss-detection-008
    system: near-miss-detection
    gdd: design/gdd/near-miss-detection.md
    category: "Data"
    requirement: "The `near_miss_detected` payload is exactly `{hazard_id, run_id}` (strict allowlist, no closeness value). `run_id` is read from the last `run_reset` seen."
    source: "CR7"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-near-miss-detection-009
    system: near-miss-detection
    gdd: design/gdd/near-miss-detection.md
    category: "Core"
    requirement: "Config guard: `NEAR_MISS_ANGLE_COEFF` or `NEAR_MISS_S_COEFF` <= 0 gives `NEAR_MISS_MARGIN_NONPOSITIVE`. Strict containment of the hit zone in the near zone is the invariant."
    source: "F1-NM, EC, AC-7"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-near-miss-detection-010
    system: near-miss-detection
    gdd: design/gdd/near-miss-detection.md
    category: "Core"
    requirement: "Preflight `NEAR_ZONE_OVERLAP` covers the 3+ pieces sharing a critical `s0` case. It is checked on angularly adjacent neighbors, including the wraparound pair, over the whole library, using near zones. It must not fire for non-adjacent pieces. The two-piece proof is `fraction_consumed = k/GAP_MARGIN < 1`."
    source: "F3-NM, AC-8, AC-9, AC-10"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-near-miss-detection-011
    system: near-miss-detection
    gdd: design/gdd/near-miss-detection.md
    category: "Timing"
    requirement: "The test runs every tick in every phase (stationary degenerate case). A non-finite `theta` or `s` is a no-op frame (hold last good, log one error)."
    source: "CR8, EC"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-near-miss-detection-012
    system: near-miss-detection
    gdd: design/gdd/near-miss-detection.md
    category: "Timing"
    requirement: "Along-track margin time budget is `S_MARGIN/v_max`: 16 ms at defaults, about 5 ms at the worst legal corner, so near-zone detection can be lost to a dropped frame."
    source: "F1-NM note, NM-1"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-near-miss-detection-013
    system: near-miss-detection
    gdd: design/gdd/near-miss-detection.md
    category: "Core"
    requirement: "Same-tick `hazard_bound` plus `hazard_released` creates then tears down with no emit. A release on the same tick as a natural exit emits exactly once."
    source: "EC"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-near-miss-detection-014
    system: near-miss-detection
    gdd: design/gdd/near-miss-detection.md
    category: "Core"
    requirement: "No side effects. Nothing is sent to Ball Movement, Obstacle or Run State. Inputs: `theta`, `theta_prev`, `s`, `s_prev`, the three Obstacle signals, `run_id`."
    source: "CR9"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-near-miss-detection-015
    system: near-miss-detection
    gdd: design/gdd/near-miss-detection.md
    category: "Core"
    requirement: "Determinism: no randomness; bit-identical streams over a 500-tick script; no shared static state."
    source: "CR8"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-near-miss-detection-016
    system: near-miss-detection
    gdd: design/gdd/near-miss-detection.md
    category: "Testing"
    requirement: "Lint (engine-coupling regex family, as Obstacle) plus a reuse-not-reimplement guard (no second `arc_overlap`, and a behavioral parity check against `ObstacleMath` on the AC-3..AC-6 poses). Fixtures `make_near_miss_fixture`, `make_hazard_bound_stub`, `make_core`."
    source: "Acceptance Criteria"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-near-miss-detection-017
    system: near-miss-detection
    gdd: design/gdd/near-miss-detection.md
    category: "Testing"
    requirement: "NM-1 on-device check, BLOCKING at first-playable: near-miss-to-hazard-passed ratio within +/-20% between early (<20 s) and late (>T_RAMP) bands, at least 30 hazards passed per band. Failure response: adjust the coefficients inside 0.5-1.5, never `GAP_MARGIN`/`GAP_MIN`."
    source: "NM-1"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-near-miss-detection-018
    system: near-miss-detection
    gdd: design/gdd/near-miss-detection.md
    category: "SaveLoad"
    requirement: "None. Tuning in `NearMissConfig.tres` (AC-27 advisory)."
    source: "Tuning Knobs"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-near-miss-detection-019
    system: near-miss-detection
    gdd: design/gdd/near-miss-detection.md
    category: "Rendering"
    requirement: "None owned. Juice owns the VFX/audio/haptic. A coalescing requirement is handed to Juice (two near-misses within a short window must merge into one cue)."
    source: "Visual/Audio, OQ8"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-scoring-personal-best-001
    system: scoring-personal-best
    gdd: design/gdd/scoring-personal-best.md
    category: "Core"
    requirement: "Logic is split into static `ScoreMath` (`score(s)`, `is_new_best`), `ScoreCore` (RefCounted), and the `ScoreService` driver node (no autoload)."
    source: "CR7, CR11, Targets"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-scoring-personal-best-002
    system: scoring-personal-best
    gdd: design/gdd/scoring-personal-best.md
    category: "Core"
    requirement: "`ScoreCore.new(s_seam, get_value_seam, set_value_seam, milestone_distances: Array[int])` takes three Callable seams plus one data array. The static `validate_seams(s,g,s2)->bool` uses `Callable.is_valid()`; `_init` asserts it (debug builds only). Release safety comes from the composition root binding statically typed method references, never string-built Callables."
    source: "CR7, AC-11a"
    created: 2026-10-03
