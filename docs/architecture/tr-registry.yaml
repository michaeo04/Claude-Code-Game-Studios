  - id: TR-scoring-personal-best-003
    system: scoring-personal-best
    gdd: design/gdd/scoring-personal-best.md
    category: "Core"
    requirement: "The public surface is exactly six non-underscore methods: `step()`, `on_run_reset()`, `on_run_ended(run_id,hazard_id,run_time_ms)`, `on_run_abandoned(run_id,run_time_ms)`, `get_current_score()`, `get_personal_best()`. Getters are methods, not computed properties. Signals: `personal_best_updated(int)`, `personal_best_passed(int)`, `milestone_crossed(int)`."
    source: "CR7, CR11, AC-11b"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-scoring-personal-best-004
    system: scoring-personal-best
    gdd: design/gdd/scoring-personal-best.md
    category: "Core"
    requirement: "`current_score = floori(s)` (an int), recomputed from `s` each `step()`, never accumulated. It is monotone non-decreasing and frozen automatically when `s` is frozen (no phase argument)."
    source: "CR1, CR2, CR4, F1, AC-4, AC-5"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-scoring-personal-best-005
    system: scoring-personal-best
    gdd: design/gdd/scoring-personal-best.md
    category: "Core"
    requirement: "`step()` guard order is `is_finite(s) and s>=0.0 and s<=9.2e18`, then `floori(s)`, then hold if `floori(s) < current_score`. Check before converting, never after. A violation holds `current_score`. There is no separate `last_s` tracker."
    source: "F1, EC, AC-15"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-scoring-personal-best-006
    system: scoring-personal-best
    gdd: design/gdd/scoring-personal-best.md
    category: "Core"
    requirement: "`on_run_reset()` zeroes `current_score`, the `has_passed_this_run` latch and `next_milestone_index` synchronously. It is non-deferred and runs before `run_started`."
    source: "CR3, CR11, AC-6, AC-19"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-scoring-personal-best-007
    system: scoring-personal-best
    gdd: design/gdd/scoring-personal-best.md
    category: "Core"
    requirement: "`run_ended` and `run_abandoned` finalize identically, from the stored `current_score` (not re-read `s`; `hazard_id` and `run_time_ms` ignored). `is_new_best = final_score > personal_best` (strict, tie is false). A duplicate ending call is idempotent for free."
    source: "CR5, CR6, F2"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-scoring-personal-best-008
    system: scoring-personal-best
    gdd: design/gdd/scoring-personal-best.md
    category: "SaveLoad"
    requirement: "The only persistence is `[scoring].personal_best` in `save.cfg` via Save & Persistence. It is read once at construction (`get_value(\"scoring\",\"personal_best\",0)`, coerced to int, clamped `max(0,...)`, an oversized value deliberately not clamped). It is written immediately via `set_value(\"scoring\",\"personal_best\",final_score)` only on a new best. In-memory is updated and the event fires even on `WRITE_FAILED`. `get_value` is called exactly once per session."
    source: "CR6, CR7, EC, AC-9, AC-14, AC-18"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-scoring-personal-best-009
    system: scoring-personal-best
    gdd: design/gdd/scoring-personal-best.md
    category: "Core"
    requirement: "`personal_best_updated(final_score)` fires once, after the in-memory best is updated and synchronously inside the `run_ended`/`run_abandoned` handler."
    source: "CR6, CR11, AC-8"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-scoring-personal-best-010
    system: scoring-personal-best
    gdd: design/gdd/scoring-personal-best.md
    category: "Core"
    requirement: "`personal_best_passed(personal_best)` fires once per run on the first tick `current_score > personal_best` (strict), never while in-memory `personal_best==0`, and re-arms on reset."
    source: "CR12"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-scoring-personal-best-011
    system: scoring-personal-best
    gdd: design/gdd/scoring-personal-best.md
    category: "Core"
    requirement: "`milestone_crossed(threshold)` uses an index latch with a `while` loop, so several thresholds can fire in one `step()` in ascending order. An empty array disables it."
    source: "CR13, AC-23, AC-24"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-scoring-personal-best-012
    system: scoring-personal-best
    gdd: design/gdd/scoring-personal-best.md
    category: "Data"
    requirement: "`ScoringConfig` Resource (`@export var milestone_distances: Array[int]`). A pure `validate_milestones(Array)->Array[String]` rejects non-ascending, duplicate, non-positive and non-integer entries. The composition root refuses to construct `ScoreCore` on a non-empty result."
    source: "Tuning Knobs, AC-25"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-scoring-personal-best-013
    system: scoring-personal-best
    gdd: design/gdd/scoring-personal-best.md
    category: "Timing"
    requirement: "`ScoreService.step()` runs once per tick strictly after Ball Movement's step, using the same callback type (`_physics_process` vs `_process` must match). Run State emits the ending and forces that tick's `dt_eff` to 0. `final_score == floori(ball.s)` at ending time."
    source: "CR5, CR11, AC-22"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-scoring-personal-best-014
    system: scoring-personal-best
    gdd: design/gdd/scoring-personal-best.md
    category: "Core"
    requirement: "`ScoreService` connects at composition-root construction, before Run State's first emit (Godot drops signals emitted before `connect()`), and is registered per Run State's pinned order."
    source: "CR11"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-scoring-personal-best-015
