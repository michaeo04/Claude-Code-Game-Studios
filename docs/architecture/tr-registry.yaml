    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "Testing"
    requirement: "Tests live in tests/unit/menus_screen_flow/ as menu_[feature]_test.gd. A fresh core per case. make_menu_fixture and make_pull_stub are used. Phase, source and input_source constants are reused from the owning systems"
