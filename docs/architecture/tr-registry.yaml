    category: "Timing"
    requirement: "Hitstop is a fixed 0.20 s in every mode and never scaled by reduced motion. The composition root injects `hitstop_actual` into Run State config. The sequence must tolerate an early cut by run_reset"
    source: "Rules 3,8,10"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-juice-feedback-008
    system: juice-feedback
    gdd: design/gdd/juice-feedback.md
    category: "Rendering"
    requirement: "Hit grey-out multiplies chroma toward 0 on all world elements with luminance preserved. The killer hazard (looked up by hazard_id) is exempt. Crossfade takes 1-2 frames"
    source: "Rule 3, V/A table"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-juice-feedback-009
    system: juice-feedback
    gdd: design/gdd/juice-feedback.md
    category: "Rendering"
    requirement: "Hit flash is a full-screen Rim White overlay, peak opacity at most 0.30, at most 2 frames, at hitstop onset. Reduced motion scales it by 0.5"
    source: "Rules 3,10"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-juice-feedback-010
    system: juice-feedback
    gdd: design/gdd/juice-feedback.md
    category: "Rendering"
    requirement: "Near-miss ring pulse and PB ring sweep are a shader term on the tube material, additive, Rim White core with Lagoon edge. The near-miss ring expands radially at the ball position via Tube Track P(theta,s,h). The PB sweep travels along s. The near-miss ring is clipped from hazard footprints"
    source: "V/A, Perf note"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-juice-feedback-011
    system: juice-feedback
    gdd: design/gdd/juice-feedback.md
    category: "Rendering"
    requirement: "Shard burst is one GPUParticles3D with one mesh and one material. It is visual-only with no physics and no per-shard nodes. Shards have rounded corners, start as hitstop ends, and travel at SHARD_BURST_SPEED"
    source: "Tuning, Perf note"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-juice-feedback-012
    system: juice-feedback
    gdd: design/gdd/juice-feedback.md
    category: "Rendering"
    requirement: "Ball rim glow is a fresnel treatment layered on the ball's base material. Silhouette and scale are unchanged. It has a Lagoon edge"
    source: "V/A table"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-juice-feedback-013
    system: juice-feedback
    gdd: design/gdd/juice-feedback.md
    category: "Core"
    requirement: "The only Camera call is apply_fov_punch(amount, duration), with amount = 0.015*CAMERA_FOV and duration = NEAR_MISS_WINDOW. There is no shake and no transform change"
    source: "Rule 9, F3"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-juice-feedback-013b
    system: juice-feedback
    gdd: design/gdd/juice-feedback.md
    category: "Timing"
    requirement: "The flash throttle applies only to the ring flash pop. Rim, whoosh, haptic and FOV punch always fire. A shared rolling ledger holds the last 1.0 s of seam, hit and ring flash timestamps, and a 4th flash in the window is held under the luminance threshold. Seam timestamps are derived from Tube Track s, L and n_seams. The ledger and cooldown are NOT cleared by run_reset"
    source: "Rule 11, F2, Edge Cases"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-juice-feedback-014
    system: juice-feedback
    gdd: design/gdd/juice-feedback.md
    category: "Platform"
    requirement: "Juice calls haptic(NEAR_MISS) and haptic(HIT) unconditionally, with no haptics_enabled check. There is no PB haptic and one call per hit. Reduced motion never scales amplitude"
    source: "Rule 12"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-juice-feedback-015
    system: juice-feedback
    gdd: design/gdd/juice-feedback.md
    category: "Core"
    requirement: "reduced_motion_enabled is read at presentation start only. It scales flash opacity, shard intensity and PB bloom by 0.5, never hitstop. A mid-flight toggle has no effect"
    source: "Rule 10, Edge Cases"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-juice-feedback-016
    system: juice-feedback
    gdd: design/gdd/juice-feedback.md
    category: "Audio"
    requirement: "Three cues. Whoosh lasts 0.08 s from rim onset. The hit sting is a dry transient with decay at most 300-400 ms, synced to the flash. The PB sting is one short rising gesture layered over the hit sting. None is intensity-scaled"
    source: "V/A Audio"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-juice-feedback-017
    system: juice-feedback
    gdd: design/gdd/juice-feedback.md
    category: "Rendering"
    requirement: "Presentation fits the budget. Rings add zero draw calls and shards are batched, so Juice adds at most a few draw calls. PB bloom eases in and out with no hard step"
    source: "Perf note"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-juice-feedback-018
    system: juice-feedback
    gdd: design/gdd/juice-feedback.md
    category: "Core"
    requirement: "Only one near-miss is retriggered per event, and the latest replaces. Same-tick near-misses each play fully. A stale-run_id filter is not needed because the source suppresses"
    source: "Edge Cases"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-juice-feedback-019
    system: juice-feedback
    gdd: design/gdd/juice-feedback.md
    category: "Data"
    requirement: "Persistent state: none. Session-only wall-clock state is the cooldown timer and the ledger"
    source: "Edge Cases"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-juice-feedback-020
    system: juice-feedback
    gdd: design/gdd/juice-feedback.md
    category: "Testing"
    requirement: "Tests live in tests/unit/juice_feedback/ as juice_[feature]_test.gd. They use make_juice_fixture, make_core and make_sink, 1e-6 float tolerance and exact log codes. Two identical scripted cores must be bit-identical. A lint bans Input., Engine., Time., OS., DisplayServer., get_tree, _process, randi, randf and PhysicsServer in JuiceMath/Core/Config. A second scan restricts outbound calls to apply_fov_punch, haptic and an allowlist of render/audio stubs"
    source: "AC section"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-juice-feedback-021
    system: juice-feedback
    gdd: design/gdd/juice-feedback.md
    category: "Testing"
    requirement: "Device evidence: the 3 flashes/s cap under real frame jitter, Lagoon-edge contrast on a real device, and shard count and speed via profiling. All are ADVISORY"
    source: "AC section"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-environment-theming-001
    system: environment-theming
    gdd: design/gdd/environment-theming.md
    category: "Data"
    requirement: "`EnvConfig` is a Resource holding every MapConfig field it owns (seam_pattern_id, fog_mode, fog_depth_begin, fog_end_distance, fog_depth_curve, fog_density, fog_color, readable_distance, tube_color, sky_top_color, sky_bottom_color, prop_set_id) plus the knobs. `validated(log_sink)` returns a clamped copy"
    source: "Rules 1,13"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-environment-theming-002
    system: environment-theming
    gdd: design/gdd/environment-theming.md
    category: "Core"
    requirement: "`EnvMath` is a static class: factor, luminance blend, contrast, an F_read bisection search, F2 fog_end_distance(speed) and F3 L_ball_adjusted. All are parametric in MapConfig and never hardcoded to Map 1"
    source: "Rule 13, F1-F3"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-environment-theming-003
    system: environment-theming
    gdd: design/gdd/environment-theming.md
    category: "Core"
    requirement: "`EnvCore` is a RefCounted with no engine calls. It takes injected speed and colorblind_safe_enabled doubles and a log_sink, and holds the MapConfig and the last L_ball_adjusted. It is deterministic"
    source: "Rules 12-13"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-environment-theming-004
    system: environment-theming
    gdd: design/gdd/environment-theming.md
    category: "Rendering"
    requirement: "Fog uses a depth ramp with factor = smoothstep(begin, end, d)^curve * density. Density must be 1.0, because exponential mode never reaches 100%. d is radial from the camera eye"
    source: "Rules 3-4, F1"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-environment-theming-005
    system: environment-theming
    gdd: design/gdd/environment-theming.md
    category: "Core"
    requirement: "Map load computes F_read from the 4:1 contrast crossing. It rejects with MAP_VISIBILITY_UNSAFE if F_read < T_VIS_MIN*v_max + d_cam, evaluating the speed-pulled F at v_max. A bad range gives FOG_RANGE_INVALID"
    source: "Rules 3,4,11"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-environment-theming-006
    system: environment-theming
    gdd: design/gdd/environment-theming.md
    category: "Rendering"
    requirement: "Speed-driven fog pull moves only fog_depth_end (written each frame while Running). u = clamp((speed-10)/15, 0, 1) and F = F_base - FOG_PULL_MAX*u. fog_depth_begin is never pulled, because F_read is about 17x more sensitive to it. F stays above F_read"
    source: "Rule 5, F2"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-environment-theming-007
    system: environment-theming
    gdd: design/gdd/environment-theming.md
    category: "Rendering"
    requirement: "A world chroma multiplier of 0.88 at v_max applies to tube, sky and prop materials only. It is a separate parameter from any hazard/ball/pickup parameter, never a shared uniform gated by an object flag"
    source: "Rule 5, V/A"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-environment-theming-008
    system: environment-theming
    gdd: design/gdd/environment-theming.md
    category: "Rendering"
    requirement: "The Menu state evaluates no speed formula and shows resting fog values. The preview hazard holds a fixed screen position independent of s_idle"
    source: "Rule 6, V/A table"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-environment-theming-009
    system: environment-theming
    gdd: design/gdd/environment-theming.md
    category: "Rendering"
    requirement: "colorblind_safe_enabled applies L_ball_adjusted to the ball material itself. It is read from the getter at construction/map load AND on setting_changed, in any phase, with no wait for run_reset. Only the lightness axis changes"
    source: "Rule 9, F3, AC-19,23,24,25"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-environment-theming-010
    system: environment-theming
    gdd: design/gdd/environment-theming.md
    category: "Core"
    requirement: "The F3 clamp is L_ball_adjusted = max(min(L_base, L_target), L_floor). It is bit-identical to base when the toggle is off, and it re-derives from the map's own L_hazard and L_ember"
    source: "F3"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-environment-theming-011
    system: environment-theming
    gdd: design/gdd/environment-theming.md
    category: "Core"
    requirement: "The only ball-related output is the single l_ball_adjusted value. Environment makes no request to any other system, and Ball Movement has no consumer"
    source: "Rules 7,12, AC-13"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-environment-theming-012
    system: environment-theming
    gdd: design/gdd/environment-theming.md
    category: "Rendering"
    requirement: "The Double Gate plinth is environment-owned geometry. Height is 0.15D, the span is the gate arc plus a 0.5D margin each end, the edge is filleted, chroma is at most 0.05, and it never uses the Signal Red or Ember hex. It is subject to the 0.88 chroma shift"
    source: "Rule 10, V/A"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-environment-theming-013
    system: environment-theming
    gdd: design/gdd/environment-theming.md
    category: "Rendering"
    requirement: "Background props are MultiMesh-instanced, 3-6 meshes. A palette-swap map is retinted material parameters only, with zero new draw calls. New geometry needs its own budget"
    source: "V/A footprint"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-environment-theming-014
    system: environment-theming
    gdd: design/gdd/environment-theming.md
    category: "Rendering"
    requirement: "The tube, sky and prop materials use a sky gradient of 2 stops. Sky hue is constant across states. Mood is carried by fog, chroma and light key only"
    source: "V/A table"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-environment-theming-015
    system: environment-theming
    gdd: design/gdd/environment-theming.md
    category: "Rendering"
    requirement: "Glow and tonemap behaviour on Forward+ (glow before tonemapping since 4.6) must not disturb the contrast numbers. The F1 derivation assumes Forward+ fog. The Mobile renderer is unverified"
    source: "Open Question 5, AC-22"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-environment-theming-016
    system: environment-theming
    gdd: design/gdd/environment-theming.md
    category: "Timing"
    requirement: "Per-frame order is Ball speed read, then F2 evaluation, then the fog write and chroma uniform write. The toggle is event-driven and not per-frame"
    source: "Interactions, States"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-environment-theming-017
    system: environment-theming
    gdd: design/gdd/environment-theming.md
    category: "Data"
    requirement: "Persistent state: none. colorblind_safe_enabled is persisted by Settings and only read here. EnvCore holds the last L_ball_adjusted in memory"
    source: "Rule 13"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-environment-theming-018
    system: environment-theming
    gdd: design/gdd/environment-theming.md
    category: "Testing"
    requirement: "Tests live in tests/unit/environment_theming/ as environment_theming_[feature]_test.gd. make_env_fixture returns Map 1 data. Bisection oracles are computed from the formula. A lint bans request_, Input., Engine., Time., OS., DisplayServer., get_tree, _process and randi in EnvMath/Core/Config"
    source: "AC section"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-environment-theming-019
    system: environment-theming
    gdd: design/gdd/environment-theming.md
    category: "Testing"
    requirement: "Deferred checks: the integration driver with a real BallCore, and on-device Mobile-renderer contrast sampling. ENV-1 is a mood screenshot, ADVISORY"
    source: "AC section"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-001
    system: hud
    gdd: design/gdd/hud.md
    category: "Core"
    requirement: "`HudCore` is a RefCounted with no engine calls and no HudMath. Per-tick pull seams: get_current_score() int, get_resume_countdown() {remaining,digit,progress}, get_valid(), get_state(). It also pulls get_personal_best() once at construction"
    source: "Rule 14"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-002
    system: hud
    gdd: design/gdd/hud.md
    category: "Core"
    requirement: "Push handlers: on_phase_changed(new, old), on_run_paused(source), on_run_ended(run_id, hazard_id, run_time_ms), on_run_resuming(duration_ms), on_restart_unlocked(run_id), on_run_reset(run_id), on_personal_best_updated(int), on_personal_best_passed(int), on_tap(press_us), on_pause_tapped(), on_menu_tapped(press_us). There is no milestone_crossed handler"
    source: "Rule 14"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-003
    system: hud
    gdd: design/gdd/hud.md
    category: "Core"
    requirement: "There are exactly three outbound sinks (pause_requested(button), restart_requested(press_us), menu_requested(press_us)) plus a log_sink. The constructor accepts exactly those seams and sinks"
    source: "Rule 11"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-004
    system: hud
    gdd: design/gdd/hud.md
    category: "Core"
    requirement: "`snapshot() -> Dictionary` of display state, plus banner_shown and banner_cleared signals. The view never polls transients"
    source: "Rule 14"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-005
    system: hud
    gdd: design/gdd/hud.md
    category: "Core"
    requirement: "Score is displayed exactly each tick with no smoothing, as an int. BEST is hidden while the stored best is 0. personal_best_passed enters a persistent NEW BEST state (label, live value, Lagoon outline) until run_reset"
    source: "Rule 2"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-006
    system: hud
    gdd: design/gdd/hud.md
    category: "Core"
    requirement: "The banner shows on personal_best_updated and clears on run_reset or on phase_changed to Menu. It holds across app_interrupted/app_returned"
    source: "Rule 3"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-007
    system: hud
    gdd: design/gdd/hud.md
    category: "Core"
    requirement: "The restart lock is cosmetic. While valid is true, EVERY tap in Hit is forwarded once with its press_us, with no debounce or buffering. While valid is false the tap is swallowed and the cue `Sensor not ready` shows. valid is read when the tap is handled"
    source: "Rule 6"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-008
    system: hud
    gdd: design/gdd/hud.md
    category: "Core"
    requirement: "Sensor cues are re-derived each tick: `Reconnecting…` (Acquiring), `No motion sensor` (Unavailable, or defensively with no prior Live). HUD keeps its own session-long was-Live latch. The Menu button shows in Hit while valid is false"
    source: "Rule 7"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-009
    system: hud
    gdd: design/gdd/hud.md
    category: "Core"
    requirement: "The sensor-lost pause screen latches the pause source for the whole Paused phase. HUD handles run_paused first and phase_changed last. The screen hides in the same tick valid becomes true"
    source: "Rule 8"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-010
    system: hud
    gdd: design/gdd/hud.md
    category: "Core"
    requirement: "The resume countdown is displayed from the pulled F5 values only, never accumulated from dt. Hitches must not diverge it"
    source: "Rule 5"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-011
    system: hud
    gdd: design/gdd/hud.md
    category: "Timing"
    requirement: "run_reset completes synchronously within a 2 ms share of t_reset. There is no async work and any banner tween is killed. The restart prompt re-locks"
    source: "Rule 12"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-012
    system: hud
    gdd: design/gdd/hud.md
    category: "Core"
    requirement: "The pause button is visible only in Running. It is sent on release inside, with no HUD debounce"
    source: "Rule 4"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-013
    system: hud
    gdd: design/gdd/hud.md
    category: "Input"
    requirement: "The view owns a full-screen tap catcher enabled only in Hit. Pause and Menu sit above it with mouse_filter so they win. An inactive Menu (Hit, before restart_unlocked, valid false) consumes the tap and sends nothing. press_us is stamped on press-down only"
    source: "Rule 14; UX Layering"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-014
    system: hud
    gdd: design/gdd/hud.md
    category: "UI"
    requirement: "(UX) Layout is dp-based inside Platform Services safe_area. Zones: Z1 top-left, Z2 pause top-right (at least 40 dp from the right edge, 16 dp from the top), Z3 banner, Z4 shared status slot at min(0.70H, H-264), Z5 Menu. The bottom 96 dp is clear. Minimum safe area is 360x560 dp"
    source: "UX Layout Zones"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-015
    system: hud
    gdd: design/gdd/hud.md
    category: "UI"
    requirement: "(UX) dp to viewport units: viewport_units_per_dp = (viewport_size.x/screen_size.x)*(screen_dpi/160). The dpi source and stretch mode need an ADR. The fallback is 1 with one log. sp equals dp"
    source: "UX Platform"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-016
    system: hud
    gdd: design/gdd/hud.md
    category: "UI"
    requirement: "(UX) The HUD canvas sits above the world and below Menus screens. The Menu/Running Ink cut layer sits ABOVE the HUD canvas. The HUD adds no fades and phase changes are instant"
    source: "UX Layering"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-017
    system: hud
    gdd: design/gdd/hud.md
    category: "Rendering"
    requirement: "(UX) Every element is a Rim White 85% pill with Ink text. Colours are Ink, Rim White and Lagoon only. Pill coverage is at most 17% of safe area (21% localized)"
    source: "UX Visual budget"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-018
    system: hud
    gdd: design/gdd/hud.md
    category: "Rendering"
    requirement: "(UX) HUD performance: at most 20 draw calls and 1.0 ms per tick in the worst-case Hit state. No dropped frame at 60 FPS over 60 s"
    source: "UX-16"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-019
    system: hud
    gdd: design/gdd/hud.md
    category: "UI"
    requirement: "(UX) Touch targets are at least 48 dp and activate on release inside. Press feedback scales to 0.94 while held. The countdown ring runs 0-1 clockwise, and the final partial digit shows ring only"
    source: "UX Elements; P2, P3"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-020
    system: hud
    gdd: design/gdd/hud.md
    category: "UI"
    requirement: "(UX) The sensor-lost Menu readying fill runs over an injected PAUSE_INPUT_GUARD value via a view-owned timer started at the phase change into Paused, including Resuming to Paused. A tap in the window is still forwarded"
    source: "UX Elements 7; UX-15"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-021
    system: hud
    gdd: design/gdd/hud.md
    category: "Platform"
    requirement: "(UX) AccessKit names and reading order are proposals only until verified on 4.7.2. Live score is not announced per tick. OS text scaling is not honoured"
    source: "UX Accessibility"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-022
    system: hud
    gdd: design/gdd/hud.md
    category: "Core"
    requirement: "HUD is deterministic with no randomness. Persistent state: none. Only the was-Live latch persists, session-only"
    source: "Rule 13"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-hud-023
    system: hud
    gdd: design/gdd/hud.md
    category: "Testing"
    requirement: "Tests live in tests/unit/hud/ and tests/integration/hud/ as hud_[feature]_test.gd. Fixtures are make_hud_fixture, make_pull_stub (a closure-safe container) and make_sink_spy. An advisory lint bans Time., Engine., OS., DisplayServer., get_tree and ConfigFile. Device and screenshot evidence goes to production/qa/evidence/hud/"
    source: "AC section"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-menus-screen-flow-001
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "Core"
    requirement: "`MenuCore` is a RefCounted with no engine calls and no MenuMath. It holds the top-level screen (Menu, ordinary Paused, map-load-failure) plus the overlay flags settings_open and confirm_quit_open"
    source: "Rules 1,12"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-menus-screen-flow-002
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "Core"
    requirement: "Pull seams (every tick): Tilt valid, state and input_source, and elapsed Boot time. personal_best is pulled at construction and again on every on_phase_changed(MENU). The 5 Settings getters are pulled when Settings opens"
    source: "Rule 12; AC Targets"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-menus-screen-flow-003
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "Core"
    requirement: "Push and tap handlers: on_phase_changed, on_run_paused(source), on_back_pressed, on_play/resume/settings/settings_back/quit_confirm/quit_cancel/retry/failure_quit_tapped, on_restart_tapped(press_us), on_menu_tapped(press_us), on_setting_changed(key, value)"
    source: "Rule 12"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-menus-screen-flow-004
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "Core"
    requirement: "There are exactly 7 outbound Callables: start_requested, resume_requested, restart_requested(press_us), menu_requested(press_us), quit, set_value(key, value), haptic(UI_TAP), plus a log_sink. No other outbound call may exist"
    source: "Rule 10"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-menus-screen-flow-005
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "Core"
    requirement: "The sensor-ready gate is valid == true AND input_source == SENSOR. It is genuinely enforced for Play, Resume, Paused Restart and Back-in-Paused: no request, no haptic, no press feedback. Menu is never gated"
    source: "Rules 2-3, 5"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-menus-screen-flow-006
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "Core"
    requirement: "Back routing per phase: Boot loading is a no-op; Boot failure opens confirm-quit; Menu opens confirm-quit; Settings closes first; Paused routes through the Resume gate; Hit goes to Menu, ungated; confirm-quit open cancels. Rapid Back in Paused is not debounced"
    source: "Rule 5"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-menus-screen-flow-007
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "Core"
    requirement: "quit() is called exactly once, only from on_quit_confirm_tapped while confirm_quit_open. The dialog is one implementation reachable from Menu and from Boot-failure. Cancel returns to the caller"
    source: "Rule 6"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-menus-screen-flow-008
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "Platform"
    requirement: "haptic(UI_TAP) fires on every forwarded or committed on-screen tap. It does not fire on a gated tap or on a hardware Back"
    source: "Rule 7"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-menus-screen-flow-009
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "Timing"
    requirement: "The map-load-failure screen shows when elapsed Boot time >= MAP_LOAD_TIMEOUT (comparison is >=). It disappears by itself when phase becomes Menu. Retry's loader contract is provisional (the loader retries Tube Track load_map and sends map_ready only on success)"
    source: "Rule 8"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-menus-screen-flow-010
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "Data"
    requirement: "`MenuConfig` is a Resource holding MAP_LOAD_TIMEOUT. A smoke test asserts the shipped default 10.0 s"
    source: "Tuning Knobs"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-menus-screen-flow-011
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "Core"
    requirement: "Settings is reachable only from Menu-base. Each change calls set_value at once. There is no revert, batching or debounce and no Save/Cancel UI. Slider commits once on release; toggles commit on tap"
    source: "Rule 4; UX Interaction Map"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-menus-screen-flow-012
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "Timing"
    requirement: "`transition_covering` (InkCoverCore.covering()) is true for at least one tick spanning Menu to Running and Paused or Hit to Menu, and false elsewhere. The Ink cover is opaque on the tick of phase_changed, holds 0.05 s, then fades out over 0.18 s (0.30 s under reduced motion). There is no cut on Restart (Hit to Running) or Resume"
    source: "Rule 9; UX Transitions"
    created: 2026-10-03
    revised: 2026-10-03
    status: active
  - id: TR-menus-screen-flow-013
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "Input"
    requirement: "Restart and Menu stamp press_us on press-down. The readying fill (PAUSE_INPUT_GUARD) is cosmetic and never gates a tap. Run State's timestamp guard is the real backstop"
    source: "Rule 3; UX Interaction Map"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-menus-screen-flow-014
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "UI"
    requirement: "(UX) Gated controls are shown dimmed (about 45%) with a reason label, never hidden. The Lagoon outline pulses at 1.2 s period only while Acquiring. Gating uses an own state flag, not Button.disabled"
    source: "UX States; Rule 2"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-menus-screen-flow-015
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "UI"
    requirement: "(UX) Layout is dp-based and thumb-low. Play is 240x72 with centre at min(0.70H, H-232). The Paused Restart/Menu row is 128x48 pills at 45% H, at least 80 dp (pill to pill) from Resume. No interactive element is within 40 dp of the side edges. The bottom 96 dp is clear. Minimum safe area is 360x560"
    source: "UX Layout Zones"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-menus-screen-flow-016
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "UI"
    requirement: "(UX) Settings is a vertical scroll list with fixed header and Back. A drag starting on a slider thumb moves the slider, and any other drag scrolls. Rows are at least 56 dp (72 dp for sliders) and all 5 are reachable at 360x560"
    source: "UX Layout, P14-15"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-menus-screen-flow-017
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "UI"
    requirement: "(UX) The confirm-quit and failure cards sit on an Ink scrim at about 60%. A scrim tap does nothing. QUIT is solid Ink on top, Cancel below, and Cancel is nearest the thumb. Entrance is about 240 ms ease-out with instant leave"
    source: "UX Interaction Map"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-menus-screen-flow-018
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "Rendering"
    requirement: "(UX) Menus add at most 25 draw calls and 1.0 ms per tick. Menu shows within 100 ms of phase Menu. Settings opens within 1 frame. The Boot background is Ink with no spinner"
    source: "MN-1"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-menus-screen-flow-019
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "UI"
    requirement: "(UX) The Ink cover sits above the HUD canvas. Menus screens sit above the HUD canvas. The ordinary Paused screen keeps its content below the top 92 dp, clear of HUD Z1"
    source: "UX Layering; UX hud.md"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-menus-screen-flow-020
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "Platform"
    requirement: "Android Back is delivered as back_pressed. Platform Services sets quit_on_go_back=false. Android-only, portrait, edge-to-edge insets via safe area"
    source: "Rule 5; UX Platform"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-menus-screen-flow-021
    system: menus-screen-flow
    gdd: design/gdd/menus-screen-flow.md
    category: "Platform"
    requirement: "(UX) AccessKit names, roles and reading order are non-binding proposals. The dialog and failure message are announced as alerts. Toggles are switches and sliders announce a percentage. OS text scaling is not honoured"
    source: "UX Accessibility"
    created: 2026-10-03
    revised: ""
    status: active
