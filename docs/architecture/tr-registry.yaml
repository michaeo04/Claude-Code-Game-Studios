    gdd: design/gdd/tube-track.md
    category: "Core"
    requirement: "Signal order: load_map, to_idle and begin_run emit window_primed, then state_changed (only if the state changed); begin_run from Running re-primes and emits window_primed only; every prime calls the binder N times"
    source: "R11, AC-8, AC-20a"
    created: 2026-10-03
    revised: ""
    status: active
  - id: TR-tube-track-010
    system: tube-track
    gdd: design/gdd/tube-track.md
    category: "Core"
    requirement: "Window sizing validated at load: A>=ceil((F+v_max*t_lat)/L)+1, B>=ceil((C_b+M_cam)/L); the far edge stays >= F+v_max*t_lat ahead after any call; a slot is recycled only when it is entirely out of view"
